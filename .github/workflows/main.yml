name: Kernel fogos | KernelSU Next + SUSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl wget python3 bc bison \
            build-essential ccache flex \
            libssl-dev libncurses5-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip unzip cpio kmod pahole

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git \
            -b sixteen \
            kernel_src
          echo "=== Kernel version ==="
          head -5 kernel_src/Makefile

      - name: Download Clang toolchain
        run: |
          mkdir clang
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "Clang: $(clang/bin/clang --version | head -1)"

      # ============================================================
      # STEP 1: Setup KernelSU Next (bukan official KernelSU)
      # Sumber: https://kernelsu-next.github.io/webpage/pages/installation.html
      # KernelSU Next mendukung non-GKI 4.x - 5.4 dengan LTS mode
      # ============================================================
      - name: Setup KernelSU Next (LTS mode for non-GKI)
        run: |
          cd kernel_src
          # KernelSU Next secara bawaan mendukung non-GKI 4.x - 5.4
          # Tidak perlu patch tambahan untuk SUSFS karena sudah terintegrasi
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next
          echo "=== KernelSU Next version ==="
          cat KernelSU-Next/kernel/Makefile | grep "^VERSION\|^PATCHLEVEL" | head -3 || echo "OK"

      # ============================================================
      # STEP 2: Non-GKI manual hook (bukan kprobes)
      # Sumber: https://kernelsu.org/guide/how-to-integrate-for-non-gki.html#manually-modify-the-kernel-source
      # ============================================================
      - name: Fix KernelSU Next for non-GKI (manual hook)
        run: |
          cd kernel_src/KernelSU-Next
          
          echo ">>> Non-GKI: Nonaktifkan KPROBES"
          find . -name "*.c" -o -name "*.h" | xargs sed -i \
            's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' || true
          
          echo ">>> Non-GKI: Aktifkan KSU_MANUAL_HOOK"
          sed -i 's/^#ifndef CONFIG_KSU_MANUAL_HOOK/#if 1/g' kernel/ksu.c || true

      # ============================================================
      # STEP 3: Fix kernel 5.4 compatibility
      # ============================================================
      - name: Fix kernel 5.4 compatibility issues
        run: |
          cd kernel_src
          
          echo ">>> Fix 1: linux/pgtable.h (not exist in kernel 5.4)"
          find drivers/kernelsu -name "*.c" -o -name "*.h" 2>/dev/null | \
            xargs grep -l "linux/pgtable.h" 2>/dev/null | while read f; do
              sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
              echo "  Fixed: $f"
            done
          
          echo ">>> Fix 2: sulog.h missing linux/init.h"
          SULOG="drivers/kernelsu/feature/sulog.h"
          if [ -f "$SULOG" ] && ! grep -q "linux/init.h" "$SULOG"; then
            sed -i '1s/^/#include <linux\/init.h>\n/' "$SULOG"
            echo "  Fixed sulog.h"
          fi
          
          echo ">>> Fix 3: Create linux/pgtable.h compat wrapper"
          mkdir -p include/linux
          if [ ! -f "include/linux/pgtable.h" ]; then
            printf '/* Compatibility wrapper for kernel < 5.8 */\n#ifndef _LINUX_PGTABLE_COMPAT_H\n#define _LINUX_PGTABLE_COMPAT_H\n#include <asm/pgtable.h>\n#endif\n' \
              > include/linux/pgtable.h
          fi

      # ============================================================
      # STEP 4: Apply SUSFS patch (untuk KernelSU Next)
      # Sumber: https://gitlab.com/simonpunk/susfs4ksu/-/tree/kernel-5.4
      # ============================================================
      - name: Apply SUSFS patch
        run: |
          cd kernel_src
          
          # Clone SUSFS repo
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b kernel-5.4 susfs_src
          
          echo ">>> Step 1: Copy SUSFS files to kernel source"
          cp susfs_src/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
          cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true
          cp susfs_src/kernel_patches/include/linux/sus_su.h include/linux/ 2>/dev/null || true
          
          echo ">>> Step 2: Patch kernel 5.4"
          # Untuk KernelSU Next, hanya perlu patch kernel 5.4
          # Tidak perlu patch KernelSU Kconfig karena sudah terintegrasi
          cp susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch ../
          patch -p1 --fuzz=3 < ../50_add_susfs_in_kernel-5.4.patch \
            && echo "SUSFS patch: OK" \
            || echo "SUSFS patch: applied with warnings (normal for non-GKI)"
          
          echo ">>> Step 3: Cleanup"
          find . -name "*.orig" -delete 2>/dev/null || true
          find . -name "*.rej" -delete 2>/dev/null || true

      # ============================================================
      # STEP 5: Fix struct kstat (tambahkan include)
      # ============================================================
      - name: Fix missing struct kstat declaration
        run: |
          cd kernel_src
          if [ -f include/linux/susfs.h ]; then
            if ! grep -q "#include <linux/stat.h>" include/linux/susfs.h; then
              sed -i '1i #include <linux/stat.h>' include/linux/susfs.h
              echo "  Added #include <linux/stat.h>"
            fi
          fi

      # ============================================================
      # STEP 6: Generate defconfig
      # ============================================================
      - name: Generate defconfig for fogos
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          MAKE_ARGS="O=../out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          
          echo ">>> Step 1: Base holi-qgki defconfig"
          make $MAKE_ARGS vendor/holi-qgki_defconfig
          
          echo ">>> Step 2: Merge fogos ext configs"
          for cfg in arch/arm64/configs/vendor/ext_config/moto-holi.config \
                     arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config; do
            if [ -f "$cfg" ]; then
              echo "  Merging: $cfg"
              ./scripts/kconfig/merge_config.sh -m -O ../out ../out/.config "$cfg"
            fi
          done
          
          echo ">>> Step 3: Set KSU + SUSFS configs"
          # KernelSU Next sudah memiliki opsi KSU_SUSFS di Kconfig
          ./scripts/config --file ../out/.config \
            -e KSU \
            -d KSU_WITH_KPROBES \
            -e KSU_MANUAL_HOOK \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -d KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -d KSU_SUSFS_SUS_SU \
            -e LTO_NONE \
            -d LTO_CLANG \
            -e RELR
          
          # ============================================================
          # FALLBACK: Enable KSU_SUSFS secara manual jika gagal
          # ============================================================
          echo ">>> Step 4: Manual fallback untuk KSU_SUSFS"
          sed -i 's/^# CONFIG_KSU_SUSFS is not set/CONFIG_KSU_SUSFS=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT is not set/CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_SUS_PATH is not set/CONFIG_KSU_SUSFS_SUS_PATH=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_SUS_MOUNT is not set/CONFIG_KSU_SUSFS_SUS_MOUNT=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT is not set/CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT is not set/CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_SUS_KSTAT is not set/CONFIG_KSU_SUSFS_SUS_KSTAT=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set/CONFIG_KSU_SUSFS_TRY_UMOUNT=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_SPOOF_UNAME is not set/CONFIG_KSU_SUSFS_SPOOF_UNAME=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_ENABLE_LOG is not set/CONFIG_KSU_SUSFS_ENABLE_LOG=y/' ../out/.config 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set/CONFIG_KSU_SUSFS_OPEN_REDIRECT=y/' ../out/.config 2>/dev/null || true
          # SUS_SU harus DISABLE untuk non-GKI
          sed -i 's/^CONFIG_KSU_SUSFS_SUS_SU=y/# CONFIG_KSU_SUSFS_SUS_SU is not set/' ../out/.config 2>/dev/null || true
          
          echo ">>> Step 5: olddefconfig"
          yes "" | make $MAKE_ARGS olddefconfig
          
          echo "=========================================="
          echo "=== CONFIG CHECK ==="
          echo "=========================================="
          grep "CONFIG_KSU" ../out/.config | grep -v "^#" || echo "WARNING: KSU missing!"
          grep "CONFIG_KSU_SUSFS" ../out/.config | grep -v "^#" || echo "WARNING: SUSFS missing!"
          grep "CONFIG_LTO" ../out/.config | grep -v "^#" || echo "WARNING: LTO missing!"
          echo "=========================================="
          cp ../out/.config ../kernel.config

      - name: Upload kernel config (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: kernel.config
          retention-days: 7

      # ============================================================
      # STEP 7: Build Image (uncompressed) - WAJIB!
      # ============================================================
      - name: Build kernel
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          
          echo ">>> Building Image (uncompressed) with $(nproc) threads..."
          yes "" | make -j$(nproc) \
            O=../out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 Image 2>&1 | tee ../build.log
          
          if [ -f ../out/arch/arm64/boot/Image ]; then
            echo "=============================="
            echo "BUILD SUCCESS!"
            ls -lh ../out/arch/arm64/boot/Image
            echo "=============================="
          else
            echo "BUILD FAILED - Last 100 lines:"
            tail -100 ../build.log
            exit 1
          fi

      # ============================================================
      # STEP 8: Package AnyKernel3 dengan block=auto + is_slot_device=1
      # Sumber: https://github.com/Shuery-Shuai/AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image ak3/
          
          cat > ak3/anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=KernelSU Next + SUSFS | fogos | AyakaUI
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fogos
          device.name2=moto_fogos
          device.name3=XT2363-2
          device.name4=XT2363-3
          device.name5=XT2363-5
          device.name6=XT2349-1
          '; }

          # block=auto + is_slot_device=1 adalah kombinasi WAJIB untuk A/B device
          # Sumber: https://github.com/Shuery-Shuai/AnyKernel3#properties--variables
          block=auto
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOF
          
          echo "=== anykernel.sh ==="
          cat ak3/anykernel.sh
          bash -n ak3/anykernel.sh && echo "SYNTAX OK" || echo "SYNTAX ERROR!"
          
          DATE=$(date +%Y%m%d-%H%M)
          ZIP="kernel-fogos-ksunext-susfs-${DATE}.zip"
          cd ak3
          zip -r9 "../${ZIP}" . -x ".git/*" -x ".github/*" "README.md" "*placeholder"
          cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          ls -lh "${ZIP}"
          unzip -l "${ZIP}" | head -30

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fogos-ksunext-susfs-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7
