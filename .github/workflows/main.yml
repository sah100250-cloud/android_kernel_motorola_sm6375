name: Build Kernel — Moto G45 5G (final fixed)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel repository (owner/repo).'
        required: false
        default: 'sah100250-cloud/android_kernel_motorola_sm6375'
        type: string
      kernel_branch:
        description: 'Branch or ref to build from'
        required: false
        default: 'main'
        type: string
      ksu_version:
        description: 'KernelSU-Next version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      susfs_version:
        description: 'SUSFS version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      clang_version:
        description: 'Proton Clang version (17/18/19)'
        required: false
        default: '18'
        type: choice
        options: ['17','18','19']
      clean_build:
        description: 'Force clean build (true/false)'
        required: false
        default: true
        type: boolean

env:
  DEVICE: fogos

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install APT dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev libncurses-dev libssl-dev lz4 make openssl \
            perl python3 python3-pip xz-utils ccache zip unzip \
            device-tree-compiler zstd libelf-dev libudev-dev \
            wget curl git

      - name: Prepare inputs (save to GITHUB_ENV)
        run: |
          set -euo pipefail
          WORKDIR="${GITHUB_WORKSPACE}/build"
          OUTPUT="${GITHUB_WORKSPACE}/build/output"
          mkdir -p "$WORKDIR" "$OUTPUT"
          echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          echo "KERNEL_REPO=${{ github.event.inputs.kernel_repo }}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${{ github.event.inputs.kernel_branch }}" >> $GITHUB_ENV
          echo "KSU_VERSION=${{ github.event.inputs.ksu_version }}" >> $GITHUB_ENV
          echo "SUSFS_VERSION=${{ github.event.inputs.susfs_version }}" >> $GITHUB_ENV
          echo "CLANG_VERSION=${{ github.event.inputs.clang_version }}" >> $GITHUB_ENV
          echo "CLEAN_BUILD=${{ github.event.inputs.clean_build }}" >> $GITHUB_ENV
          echo "DEVICE=${{ env.DEVICE }}" >> $GITHUB_ENV

      - name: Fetch kernel source (tarball -> clone -> fallback)
        run: |
          set -euo pipefail
          WORKDIR="${WORKDIR}"
          cd "$WORKDIR"
          rm -rf kernel_source || true

          REPO="${KERNEL_REPO}"
          BRANCH="${KERNEL_BRANCH}"

          if [ -z "$REPO" ] || [ "$REPO" = "null" ]; then
            REPO="${GITHUB_REPOSITORY}"
          fi

          OWNER="$(echo "$REPO" | cut -d'/' -f1)"
          NAME="$(echo "$REPO" | cut -d'/' -f2)"
          success=0

          urls=(
            "https://github.com/${OWNER}/${NAME}/archive/refs/heads/${BRANCH}.tar.gz"
            "https://codeload.github.com/${OWNER}/${NAME}/tar.gz/${BRANCH}"
          )

          for u in "${urls[@]}"; do
            echo "Trying $u"
            if wget -q --spider "$u" 2>/dev/null; then
              wget -q -O /tmp/kernel.tar.gz "$u"
              mkdir -p kernel_source
              tar -xzf /tmp/kernel.tar.gz -C kernel_source --strip-components=1 || true
              rm -f /tmp/kernel.tar.gz
              if [ -d kernel_source ] && [ "$(ls -A kernel_source || true)" ]; then
                echo "Extracted from $u"
                success=1
                break
              fi
            else
              echo "Not reachable: $u"
            fi
          done

          if [ $success -eq 0 ]; then
            echo "Tarball downloads failed; attempting non-interactive git clone (public repos only)"
            export GIT_TERMINAL_PROMPT=0
            if git clone --depth=1 --branch "$BRANCH" "https://github.com/${OWNER}/${NAME}.git" kernel_source 2>/tmp/clone.err; then
              echo "git clone succeeded"
              success=1
            else
              echo "git clone failed (snippet):"
              sed -n '1,200p' /tmp/clone.err || true
            fi
          fi

          if [ $success -eq 0 ]; then
            echo "All attempts to fetch ${REPO}@${BRANCH} failed; falling back to workflow repo contents"
            mkdir -p kernel_source
            # avoid copying into itself (when workflow repo == kernel target)
            if [ "${GITHUB_WORKSPACE}/" != "${WORKDIR}/kernel_source/" ]; then
              cp -r "${GITHUB_WORKSPACE}/." kernel_source || true
            else
              echo "Workflow repo equals kernel target; kernel_source will be current workspace"
              # already in workspace; leave as-is
            fi
            success=1
          fi

          if [ $success -ne 1 ]; then
            echo "::error::Failed to obtain kernel source"
            exit 1
          fi

          echo "Kernel source prepared at: $WORKDIR/kernel_source"
          ls -la kernel_source | head -n 40

      - name: Download Proton Clang (best-effort)
        run: |
          set -euo pipefail
          CLANG_VER="${CLANG_VERSION:-18}"
          CLANG_DIR="${HOME}/proton-clang-${CLANG_VER}"
          mkdir -p "$CLANG_DIR"
          PRIMARY="https://github.com/nicofork/proton-clang/releases/download/clang-${CLANG_VER}/proton-clang-${CLANG_VER}.tar.zst"
          BACKUP="https://gitlab.com/nicofork/proton-clang/-/archive/clang-${CLANG_VER}/proton-clang-clang-${CLANG_VER}.tar.gz"
          if wget -q --show-progress "$PRIMARY" -O /tmp/clang.tar.zst 2>/dev/null; then
            if command -v zstd >/dev/null 2>&1; then
              zstd -d /tmp/clang.tar.zst --stdout | tar xf - -C "$CLANG_DIR" --strip-components=1 || true
            else
              tar xf /tmp/clang.tar.zst -C "$CLANG_DIR" --strip-components=1 2>/dev/null || true
            fi
            rm -f /tmp/clang.tar.zst
            export PATH="$CLANG_DIR/bin:$PATH"
            echo "Proton Clang installed to $CLANG_DIR"
          else
            echo "Proton Clang unavailable; will fallback to system cross compilers"
          fi

      - name: Integrate KernelSU-Next (best-effort)
        run: |
          set -euo pipefail
          cd "${WORKDIR}/kernel_source" || exit 1
          TMPKSU="/tmp/ksu_next_src"
          rm -rf "$TMPKSU" || true
          if [ "${KSU_VERSION:-latest}" = "latest" ]; then
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git "$TMPKSU" || true
          else
            git clone --depth=1 -b "${KSU_VERSION}" https://github.com/KernelSU-Next/KernelSU-Next.git "$TMPKSU" || true
          fi
          if [ -d "$TMPKSU/kernel" ]; then
            cp -r "$TMPKSU/kernel" ./KernelSU || true
            echo "KernelSU files copied"
          else
            echo "KernelSU kernel dir not present; will rely on defconfig injection"
          fi
          rm -rf "$TMPKSU" || true

      - name: Apply SUSFS (best-effort)
        run: |
          set -euo pipefail
          cd "${WORKDIR}/kernel_source" || exit 1
          TMPSUS="/tmp/susfs_src"
          rm -rf "$TMPSUS" || true
          if [ "${SUSFS_VERSION:-latest}" = "latest" ]; then
            git clone --depth=1 https://github.com/sidex15/susfs4ksu-module.git "$TMPSUS" || true
          else
            git clone --depth=1 -b "${SUSFS_VERSION}" https://github.com/sidex15/susfs4ksu-module.git "$TMPSUS" || true
          fi
          if [ -d "$TMPSUS/kernel" ]; then
            cp -rv "$TMPSUS/kernel/"* . 2>/dev/null || true
          fi
          if [ -d "$TMPSUS/susfs" ]; then
            cp -rv "$TMPSUS/susfs" ./susfs 2>/dev/null || true
          fi
          rm -rf "$TMPSUS" || true

      - name: Patch defconfig (exclude backups)
        run: |
          set -euo pipefail
          cd "${WORKDIR}/kernel_source" || exit 1
          if [ -d "kernel_src" ]; then KR="kernel_src"; else KR="."; fi
          cd "$KR" || exit 1
          DEVICE="${DEVICE:-fogos}"
          # find defconfig but exclude .bak/.orig files
          DEF_FILE=$(find arch/arm64/configs -type f \( -iname "*${DEVICE}*" -o -iname "*sm6375*" -o -iname "*defconfig*" \) ! -iname "*.bak" ! -iname "*~" ! -iname "*.orig" 2>/dev/null | head -n1 || true)
          if [ -n "$DEF_FILE" ]; then
            # strip common backup suffixes if accidentally matched
            CLEAN_DEF="$(basename "$DEF_FILE")"
            CLEAN_DEF="${CLEAN_DEF%%.bak}"
            CLEAN_DEF="${CLEAN_DEF%%.orig}"
            echo "Using defconfig: $DEF_FILE (basename: $CLEAN_DEF)"
            cp "$DEF_FILE" "${DEF_FILE}.ci.bak" || true
            printf '\n%s\n' "# Injected: KSU/SUSFS (CI)" \
              "CONFIG_KSU=y" \
              "CONFIG_KPROBES=y" \
              "CONFIG_HAVE_KPROBES=y" \
              "CONFIG_UPROBES=y" \
              "CONFIG_KSU_SUSFS=y" \
              "CONFIG_KSU_SUSFS_SUS_PATH=y" \
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
              "CONFIG_MODULES=y" \
              "CONFIG_EXT4_FS=y" \
              >> "$DEF_FILE"
            awk '!seen[$0]++ || /^#/' "$DEF_FILE" > /tmp/def.dedup || true
            mv /tmp/def.dedup "$DEF_FILE" || true
            echo "Patched defconfig: $DEF_FILE (backup: ${DEF_FILE}.ci.bak)"
          else
            echo "::warning::No defconfig found; build may fail"
          fi

      - name: Build kernel (fix CROSS_COMPILE + robust defconfig)
        run: |
          set -euo pipefail
          cd "${WORKDIR}/kernel_source" || exit 1

          # detect kernel root reliably
          if [ -f Makefile ] && grep -m1 -E '^VERSION' Makefile >/dev/null 2>&1; then
            KROOT="."
          elif [ -f kernel_src/Makefile ] && grep -m1 -E '^VERSION' kernel_src/Makefile >/dev/null 2>&1; then
            KROOT="kernel_src"
          else
            candidate=$(find . -maxdepth 3 -type f -name Makefile -exec grep -l -m1 -E '^VERSION' {} \; 2>/dev/null | head -n1 || true)
            if [ -n "$candidate" ]; then
              KROOT=$(dirname "$candidate")
            else
              echo "::error::Kernel Makefile with VERSION not found; listing top-level:"
              ls -la || true
              exit 1
            fi
          fi

          echo "Kernel root: $KROOT"
          cd "$KROOT" || exit 1
          echo "PWD: $(pwd)"; ls -la | sed -n '1,200p'

          export ARCH=arm64
          export SUBARCH=arm64

          # ensure CROSS_COMPILE is set to aarch64 cross prefix if available
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            export CROSS_COMPILE=aarch64-linux-gnu-
            echo "Set CROSS_COMPILE=aarch64-linux-gnu- (using cross gcc/binutils)"
          else
            echo "aarch64 cross compiler not found in PATH"
          fi

          # prefer clang if available, but keep CROSS_COMPILE for binutils to avoid host-gcc miscompile
          if command -v clang >/dev/null 2>&1; then
            export CC=clang
            echo "Using clang as CC (CROSS_COMPILE may still be used for binutils)"
          elif command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            # use cross gcc; CROSS_COMPILE set above
            echo "Using aarch64-linux-gnu-gcc cross compiler"
          else
            echo "::error::No suitable compiler (clang or aarch64-linux-gnu-gcc) found"
            exit 1
          fi

          # find a real defconfig (exclude backups)
          DEF_FILE=$(find arch/arm64/configs -type f \( -iname "*${DEVICE}*" -o -iname "*sm6375*" -o -iname "*defconfig*" \) ! -iname "*.bak" ! -iname "*~" 2>/dev/null | head -n1 || true)

          if [ -n "$DEF_FILE" ]; then
            DEFBASE=$(basename "$DEF_FILE")
            # strip suffixes if any
            DEFBASE="${DEFBASE%%.bak}"
            echo "Found defconfig: $DEF_FILE -> target $DEFBASE"
            # try to run make <defbase>, but many kernels expect e.g. defconfig names without '_defconfig' suffix
            if make ARCH=arm64 "$DEFBASE" 2>/dev/null; then
              echo "make $DEFBASE succeeded"
            else
              echo "make $DEFBASE not recognized by this tree; trying 'make ${DEFBASE%_defconfig}_defconfig' then fallback to defconfig"
              # sometimes config file is named 'gki_defconfig' but target might be 'gki_defconfig' - we already tried; still fallback:
              make ARCH=arm64 defconfig || true
            fi
          else
            echo "::warning::No defconfig detected; running make defconfig"
            make ARCH=arm64 defconfig || true
          fi

          # verify .config exists
          if [ ! -f .config ]; then
            echo "::error::.config missing after defconfig step; aborting"
            ls -la arch/arm64/configs | sed -n '1,200p' || true
            exit 1
          fi

          # build (log to build.log)
          make ARCH=arm64 -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::Kernel build failed (exit $rc). build.log uploaded by artifact step."
            exit $rc
          fi
          echo "Kernel build succeeded."

      - name: Upload build log (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            ${WORKDIR}/kernel_source/**/build.log
            ${WORKDIR}/build/logs/*.log

      - name: Package & upload kernel zip (if built)
        if: success()
        run: |
          set -euo pipefail
          cd "${WORKDIR}/kernel_source" || exit 1
          if [ -d "kernel_src" ]; then cd kernel_src; fi
          OUT="${OUTPUT}"
          mkdir -p "$OUT"
          IMG=$(find . -path "*/arch/arm64/boot/Image*" -type f 2>/dev/null | head -n1 || true)
          if [ -z "$IMG" ]; then
            echo "::warning::Kernel image not found; skipping packaging"
            exit 0
          fi
          cp "$IMG" "$OUT/Image.gz" || cp "$IMG" "$OUT/Image" || true
          find . -path "*/arch/arm64/boot/dts*" -name "*.dtb" -o -name "*.dtbo" -print0 | xargs -0 -I{} cp {} "$OUT/" || true
          AK="/tmp/anykernel"
          rm -rf "$AK"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK" || true
          cp "$OUT"/Image* "$AK/" 2>/dev/null || true
          cp "$OUT"/*.dtb "$AK/" 2>/dev/null || true
          cd "$AK" || true
          printf '%s\n' "##############################" "# AnyKernel3 minimal" "##############################" > anykernel.sh
          printf '%s\n' ". tools/ak3-core.sh || true" >> anykernel.sh
          ZIP="kernel-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "/tmp/$ZIP" . -x '*.git*' -x 'README.md' -x 'LICENSE' || true
          mv "/tmp/$ZIP" "$OUT/" || true
          sha256sum "$OUT/$ZIP" > "$OUT/$ZIP.sha256" || true
          echo "Packaged: $OUT/$ZIP"

      - name: Upload kernel zip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: build/output/*.zip
