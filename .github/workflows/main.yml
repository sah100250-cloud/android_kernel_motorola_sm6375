
# .github/workflows/main.yml
# Build Kernel Motorola G45 5G (fogos) — SM6375 / Snapdragon 6s Gen 3
# KernelSU Next + SUSFS integration helper workflow (fixed)
name: 'Build Kernel — Moto G45 5G (fogos)'

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU-Next version'
        required: false
        default: 'latest'
        type: string
      susfs_version:
        description: 'SUSFS version (tag)'
        required: false
        default: 'latest'
        type: string
      clang_version:
        description: 'Proton Clang version'
        required: false
        default: '18'
        type: choice
        options:
          - '17'
          - '18'
          - '19'
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      clean_build:
        description: 'Force clean build'
        required: false
        default: true
        type: boolean

  schedule:
    - cron: '0 2 * * 1'

  push:
    branches: [ main, master ]
    # Include workflow directory so changes to any workflow trigger push runs
    paths:
      - '.github/workflows/**'

env:
  KERNEL_REPO: 'AnandSuresh02/android_kernel_motorola_sm6375'
  KERNEL_BRANCH: 'main'
  KERNEL_SRC: 'kernel_src'
  DEVICE: 'fogos'
  PLATFORM: 'holi'
  SM6375_PLATFORM: 'true'
  TZ: 'Asia/Jakarta'

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-versions:
    name: 'Resolve Latest Versions'
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.ksu_version == 'latest' ||
      github.event.inputs.susfs_version == 'latest'
    outputs:
      KSU_VERSION: ${{ steps.resolve.outputs.ksu_version }}
      SUSFS_VERSION: ${{ steps.resolve.outputs.susfs_version }}
    steps:
      - name: Resolve latest stable versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Resolving latest versions ==="

          # KSU
          if [[ "${{ github.event.inputs.ksu_version || 'latest' }}" == "latest" ]]; then
            KSU_VER=$(gh api repos/KernelSU-Next/KernelSU-Next/releases/latest --jq '.tag_name' 2>/dev/null || echo "v1.0.5")
          else
            KSU_VER="${{ github.event.inputs.ksu_version }}"
          fi
          echo "ksu_version=${KSU_VER}" >> "$GITHUB_OUTPUT"
          echo "  KernelSU-Next: ${KSU_VER}"

          # SUSFS
          if [[ "${{ github.event.inputs.susfs_version || 'latest' }}" == "latest" ]]; then
            SUSFS_VER=$(gh api repos/sidex15/susfs4ksu-module/releases/latest --jq '.tag_name' 2>/dev/null || echo "v1.5.2")
          else
            SUSFS_VER="${{ github.event.inputs.susfs_version }}"
          fi
          echo "susfs_version=${SUSFS_VER}" >> "$GITHUB_OUTPUT"
          echo "  SUSFS: ${SUSFS_VER}"

          echo "=== Version resolution complete ==="

  build:
    name: 'Build ${{ env.DEVICE }} kernel'
    needs: [resolve-versions]
    if: always() && (needs.resolve-versions.result == 'success' || needs.resolve-versions.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      kernel_version: ${{ steps.set-outputs.outputs.kernel_version }}
      build_status: ${{ steps.set-outputs.outputs.build_status }}
      ksu_version: ${{ needs.resolve-versions.outputs.KSU_VERSION }}
      susfs_version: ${{ needs.resolve-versions.outputs.SUSFS_VERSION }}

    env:
      KSU_VERSION: >-
        ${{ 
          needs.resolve-versions.outputs.KSU_VERSION ||
          github.event.inputs.ksu_version ||
          'v1.0.5'
        }}
      SUSFS_VERSION: >-
        ${{ 
          needs.resolve-versions.outputs.SUSFS_VERSION ||
          github.event.inputs.susfs_version ||
          'v1.5.2'
        }}
      CLANG_VERSION: ${{ github.event.inputs.clang_version || '18' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'true' }}
      KBUILD_BUILD_USER: 'fogos-ci'
      KBUILD_BUILD_HOST: 'github-actions'
      BUILD_START: ''
      DEVICE: ${{ env.DEVICE }}

    steps:
      - name: '[0/10] Check required tools'
        run: |
          set -euo pipefail
          which gh || (apt-get update -qq && apt-get install -yqq gh)
          gh --version || true
          which zip unzip wget tar || apt-get update -qq && apt-get install -yqq zip unzip wget tar

      - name: '[1/10] Setup build environment'
        id: setup
        run: |
          set -euo pipefail
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

          echo "╔══════════════════════════════════════════╗"
          echo "║  Kernel Build: Motorola G45 5G (fogos)   ║"
          echo "╚══════════════════════════════════════════╝"

          sudo apt-get update -qq
          sudo apt-get install -yqq \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev libssl-dev lz4 libncurses5 make openssl \
            perl python3 python3-pip xz-utils ccache zip \
            device-tree-compiler zstd libelf-dev libudev-dev \
            wget curl jq

          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          echo "Swap: $(free -h | grep Swap | awk '{print $2}')" || true

          ccache -M 10G || true
          ccache -z || true
          echo "ccache_stats=$(ccache -s | head -5 | sed -n '1p')" >> "$GITHUB_ENV"

      - name: '[2/10] Setup Proton Clang'
        id: clang
        run: |
          set -euo pipefail
          CLANG_DIR="${HOME}/proton-clang-${CLANG_VERSION}"
          echo "CLANG_DIR=${CLANG_DIR}" >> "$GITHUB_ENV"

          CLANG_URL="https://github.com/nicofork/proton-clang/releases/download/clang-${CLANG_VERSION}/proton-clang-${CLANG_VERSION}.tar.zst"

          echo "Downloading Proton Clang ${CLANG_VERSION}..."
          if ! wget -q --show-progress "${CLANG_URL}" -O /tmp/clang.tar.zst 2>/dev/null; then
            echo "::warning::Proton Clang ${CLANG_VERSION} download failed, trying backup..."
            CLANG_URL="https://gitlab.com/nicofork/proton-clang/-/archive/clang-${CLANG_VERSION}/proton-clang-clang-${CLANG_VERSION}.tar.gz"
            wget -q "${CLANG_URL}" -O /tmp/clang.tar.gz
            mkdir -p "${CLANG_DIR}"
            tar xf /tmp/clang.tar.gz -C "${CLANG_DIR}" --strip-components=1
            rm -f /tmp/clang.tar.gz
          else
            mkdir -p "${CLANG_DIR}"
            zstd -d /tmp/clang.tar.zst --stdout | tar xf - -C "${CLANG_DIR}" --strip-components=1
            rm -f /tmp/clang.tar.zst
          fi

          export PATH="${CLANG_DIR}/bin:${PATH}"

          if ! command -v clang >/dev/null 2>&1; then
            echo "::error::Clang verification failed"
            exit 1
          fi

          echo "Clang: $(clang --version | head -1)"

          # Aarch64 GCC (backup cross-compiler)
          GCC64_DIR="${HOME}/gcc-aarch64"
          mkdir -p "${GCC64_DIR}"
          wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.0.0_r1.tar.gz" \
            -O /tmp/gcc64.tar.gz || true
          if [ -f /tmp/gcc64.tar.gz ] && [ -s /tmp/gcc64.tar.gz ]; then
            tar xf /tmp/gcc64.tar.gz -C "${GCC64_DIR}"
            rm -f /tmp/gcc64.tar.gz
            echo "GCC64: $(ls ${GCC64_DIR}/bin/ 2>/dev/null | head -3)"
          fi

      - name: '[3/10] Checkout kernel source'
        id: checkout
        run: |
          set -euo pipefail
          echo "Cloning ${KERNEL_REPO} (branch: ${KERNEL_BRANCH})..."
          git clone --depth=1 -b "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel_source
          cd kernel_source

          if [ -d "${KERNEL_SRC}" ]; then
            echo "KERNEL_ROOT=${KERNEL_SRC}" >> "$GITHUB_ENV"
            echo "Using kernel source at: ${KERNEL_SRC}"
          elif [ -f "Makefile" ] && grep -q "VERSION" Makefile 2>/dev/null; then
            echo "KERNEL_ROOT=." >> "$GITHUB_ENV"
            echo "Using kernel source at: ."
          else
            echo "KERNEL_ROOT=." >> "$GITHUB_ENV"
            echo "::warning::Kernel source structure unclear, using root"
          fi

          KR="${KERNEL_ROOT:-.}"

          KVERSION=$(grep -m1 "^VERSION" Makefile | awk '{print $3}' || true)
          KPATCHLEVEL=$(grep -m1 "^PATCHLEVEL" Makefile | awk '{print $3}' || true)
          KSUBLEVEL=$(grep -m1 "^SUBLEVEL" Makefile | awk '{print $3}' || true)
          FULL_VERSION="${KVERSION:-0}.${KPATCHLEVEL:-0}.${KSUBLEVEL:-0}"
          echo "KERNEL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "Kernel version: ${FULL_VERSION}"

          echo "Platform: SM6375 (Holi) — Snapdragon 6s Gen 3"
          echo "Device: ${DEVICE} (Moto G45 5G)"
          echo "Compiler: Proton Clang ${CLANG_VERSION}"

      - name: '[4/10] Integrate KernelSU-Next'
        id: ksu
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${KERNEL_ROOT:-.}"

          KSU_REPO="KernelSU-Next/KernelSU-Next"
          KSU_TAG="${KSU_VERSION}"
          KSU_TMP="/tmp/ksu-next"
          KSU_KERNEL="${KR}/KernelSU"

          echo "=== KernelSU-Next ${KSU_TAG} ==="
          mkdir -p "${KSU_TMP}"

          RELEASE_JSON=$(gh api "repos/${KSU_REPO}/releases/tags/${KSU_TAG}" 2>/dev/null || gh api "repos/${KSU_REPO}/releases/latest" 2>/dev/null || echo "{}")
          echo "${RELEASE_JSON}" | jq -r '.tag_name' > /tmp/ksu_version.txt 2>/dev/null || true
          ACTUAL_KSU_VER=$(cat /tmp/ksu_version.txt 2>/dev/null || echo "${KSU_TAG}")
          echo "Resolved version: ${ACTUAL_KSU_VER}"
          echo "KSU_VERSION=${ACTUAL_KSU_VER}" >> "$GITHUB_ENV"

          TARBALL_URL=$(echo "${RELEASE_JSON}" | jq -r '.assets[] | select(.name | test(".*\\.tar\\.gz$|.*\\.source.*")) | .browser_download_url' | head -1 || true)

          if [ -z "${TARBALL_URL}" ] || [ "${TARBALL_URL}" == "null" ]; then
            echo "No release tarball found, using git clone..."
            git clone --depth=1 -b "${ACTUAL_KSU_VER}" "https://github.com/${KSU_REPO}.git" "${KSU_TMP}" || true
          else
            wget -q "${TARBALL_URL}" -O "${KSU_TMP}/ksu.tar.gz" || true
            mkdir -p "${KSU_TMP}/extracted"
            tar xf "${KSU_TMP}/ksu.tar.gz" -C "${KSU_TMP}/extracted" --strip-components=0 || true
          fi

          KSU_SRC="${KSU_TMP}"
          [ -d "${KSU_TMP}/extracted" ] && KSU_SRC="${KSU_TMP}/extracted"

          rm -rf "${KSU_KERNEL}"
          if [ -d "${KSU_SRC}/kernel" ]; then
            cp -r "${KSU_SRC}/kernel" "${KSU_KERNEL}" || true
          elif [ -f "${KSU_SRC}/setup.sh" ]; then
            cp -r "${KSU_SRC}" "${KSU_KERNEL}" || true
          else
            echo "::warning::KernelSU kernel source not found in release — continuing (will try defconfig enable)"
          fi

          rm -rf "${KSU_TMP}" || true

          if [ -d "${KSU_KERNEL}" ]; then
            echo "KernelSU-Next integrated at: ${KSU_KERNEL}"
            ls -la "${KSU_KERNEL}" || true
          fi

      - name: '[5/10] Apply SUSFS patches'
        id: susfs
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${KERNEL_ROOT:-.}"

          SUSFS_REPO="sidex15/susfs4ksu-module"
          SUSFS_TAG="${SUSFS_VERSION}"

          echo "=== SUSFS ${SUSFS_TAG} ==="
          SUSFS_TMP="/tmp/susfs-source"
          rm -rf "${SUSFS_TMP}" || true

          if ! git clone --depth=1 -b "${SUSFS_TAG}" "https://github.com/${SUSFS_REPO}.git" "${SUSFS_TMP}" 2>/dev/null; then
            git clone --depth=1 "https://github.com/${SUSFS_REPO}.git" "${SUSFS_TMP}" || true
          fi

          ACTUAL_SUSFS_VER=$(cd "${SUSFS_TMP}" && (git describe --tags 2>/dev/null || echo "${SUSFS_TAG}")) || ACTUAL_SUSFS_VER="${SUSFS_TAG}"
          echo "SUSFS_VERSION=${ACTUAL_SUSFS_VER}" >> "$GITHUB_ENV"
          echo "Resolved SUSFS version: ${ACTUAL_SUSFS_VER}"

          SUSFS_APPLIED=false

          if ls "${SUSFS_TMP}"/patches/*.patch 1>/dev/null 2>&1; then
            echo "Applying SUSFS patch files..."
            for patch in "${SUSFS_TMP}"/patches/*.patch; do
              echo "  Patch: $(basename "${patch}")"
              if git apply --check "${patch}" 2>/dev/null; then
                git apply "${patch}" || true
                SUSFS_APPLIED=true
              else
                echo "::warning::Patch $(basename "${patch}") does not apply cleanly"
              fi
            done
          fi

          if [ -d "${SUSFS_TMP}/kernel" ]; then
            echo "Copying SUSFS kernel source files..."
            cp -rv "${SUSFS_TMP}/kernel/"* "${KR}/" 2>/dev/null || true
            SUSFS_APPLIED=true
          fi

          if [ -d "${SUSFS_TMP}/susfs" ]; then
            echo "Copying SUSFS module source..."
            cp -rv "${SUSFS_TMP}/susfs" "${KR}/susfs" 2>/dev/null || true
            SUSFS_APPLIED=true
          fi

          if [ "${SUSFS_APPLIED}" = true ]; then
            echo "SUSFS patches applied/copies performed"
          else
            echo "::warning::No SUSFS patches applied — will enable CONFIG options in defconfig as fallback"
          fi

          rm -rf "${SUSFS_TMP}" || true

      - name: '[6/10] Configure defconfig'
        id: defconfig
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${KERNEL_ROOT:-.}"
          DEVICE="${DEVICE:-fogos}"

          echo "=== Searching for ${DEVICE} defconfig ==="

          DEFCONFIG_PATH=""
          for pattern in \
            "vendor/${DEVICE}_defconfig" \
            "vendor/${DEVICE}" \
            "vendor/sm6375_${DEVICE}_defconfig" \
            "vendor/sm6375_defconfig" \
            "${DEVICE}_defconfig" \
            "vendor/qcom/${DEVICE}_defconfig" \
            "vendor/qcom/sdm6375_${DEVICE}_defconfig"; do
            if [ -f "${KR}/arch/arm64/configs/${pattern}" ]; then
              DEFCONFIG_PATH="arch/arm64/configs/${pattern}"
              break
            fi
          done

          if [ -z "${DEFCONFIG_PATH}" ]; then
            DEFCONFIG_PATH=$(find "${KR}/arch/arm64/configs" -type f \
              \( -iname "*${DEVICE}*" -o -iname "*fogos*" -o -iname "*holi*sm6375*" -o -iname "*sm6375*" \) \
              2>/dev/null | head -1 | sed "s|${KR}/||" || true)
          fi

          if [ -z "${DEFCONFIG_PATH}" ]; then
            echo ""
            echo "Available defconfigs (sample):"
            find "${KR}/arch/arm64/configs" -type f -name "*defconfig" 2>/dev/null | sed "s|${KR}/||" | sort | head -40 || true
            echo "::error::Defconfig for ${DEVICE} not found"
            exit 1
          fi

          echo "Defconfig: ${DEFCONFIG_PATH}"
          echo "DEFCONFIG_PATH=${DEFCONFIG_PATH}" >> "$GITHUB_ENV"

          cp "${KR}/${DEFCONFIG_PATH}" "${KR}/${DEFCONFIG_PATH}.bak" || true

          cat >> "${KR}/${DEFCONFIG_PATH}" << 'KSU_SUSFS_CONFIG'

# ┌──────────────────────────────────────────┐
# │  KernelSU-Next + SUSFS Configuration     │
# └──────────────────────────────────────────┘

CONFIG_KSU=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBES_ON_FTRACE=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_UPROBE_EVENTS=y

CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNTS=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNTS=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG=y
CONFIG_KSU_SUSFS_ADD_SUS_SU=y
CONFIG_KSU_SUSFS_AVC_SPOOF=y

CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODULE_FORCE_UNLOAD=y
CONFIG_MODULE_SIG=y

CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_EXT4_USE_FOR_EXT2=y

KSU_SUSFS_CONFIG

          awk '!seen[$0]++ || /^#/' "${KR}/${DEFCONFIG_PATH}" > /tmp/defconfig_clean || true
          mv /tmp/defconfig_clean "${KR}/${DEFCONFIG_PATH}" || true

          echo ""
          echo "=== Verifying config injection ==="
          for cfg in \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_KSU_SUSFS_SUS_PATH=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_AVC_SPOOF=y" \
            "CONFIG_KPROBES=y" \
            "CONFIG_MODULES=y" \
            "CONFIG_EXT4_FS=y"; do
            if grep -q "^${cfg}$" "${KR}/${DEFCONFIG_PATH}"; then
              echo "  ✓ ${cfg}"
            else
              echo "  ✗ ${cfg} — MISSING"
            fi
          done

      - name: '[7/10] Build kernel'
        id: build
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${KERNEL_ROOT:-.}"
          CLANG_DIR="${CLANG_DIR:-${HOME}/proton-clang-${CLANG_VERSION}}"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          DEFCONFIG_PATH="${DEFCONFIG_PATH:-${KERNEL_ROOT}/arch/arm64/configs/${DEVICE}_defconfig}"
          JOBS=$(nproc || echo 2)
          THREADS=$((JOBS + 2))
          echo "Build jobs: ${THREADS} (CPU cores: ${JOBS})"

          CROSS64=""
          if command -v aarch64-linux-gnu-gcc &>/dev/null; then
            CROSS64="aarch64-linux-gnu-"
          elif [ -x "${HOME}/gcc-aarch64/bin/aarch64-linux-android-gcc" ]; then
            CROSS64="${HOME}/gcc-aarch64/bin/aarch64-linux-android-"
          fi
          echo "Cross-compiler: ${CROSS64:-system default}"

          CROSS32=""
          if command -v arm-linux-gnueabihf-gcc &>/dev/null; then
            CROSS32="arm-linux-gnueabihf-"
          fi
          echo "Cross-compiler 32-bit: ${CROSS32:-system default}"

          BUILD_SCRIPT=""
          for script in procsys.sh build.sh build_kernel.sh Makefile_build.sh; do
            if [ -f "${KR}/${script}" ] && [ -x "${KR}/${script}" ]; then
              BUILD_SCRIPT="${KR}/${script}"
              break
            fi
          done

          if [ -n "${BUILD_SCRIPT}" ]; then
            echo "Using build script: ${BUILD_SCRIPT}"
            cd "${KR}"
            chmod +x "${BUILD_SCRIPT}"

            export CC="clang"
            export ARCH="arm64"
            export SUBARCH="arm64"

            if [[ "${CLEAN_BUILD}" == "true" ]]; then
              echo "=== Clean build ==="
              make ARCH=arm64 mrproper 2>/dev/null || true
            fi

            bash "${BUILD_SCRIPT}"

          else
            echo "No build script found, using direct make"
            cd "${KR}"

            export CC="clang"
            export LD="ld.lld"
            export AR="llvm-ar"
            export NM="llvm-nm"
            export STRIP="llvm-strip"
            export OBJCOPY="llvm-objcopy"
            export OBJDUMP="llvm-objdump"
            export OBJSIZE="llvm-size"
            export READELF="llvm-readelf"
            export HOSTCC="clang"
            export HOSTCXX="clang++"
            export HOSTAR="llvm-ar"
            export HOSTLD="ld.lld"
            export ARCH="arm64"
            export SUBARCH="arm64"

            MAKE_FLAGS=(
              "ARCH=arm64"
              "CC=clang"
              "CROSS_COMPILE=${CROSS64}"
              "CROSS_COMPILE_COMPAT=${CROSS32}"
              "LD=ld.lld"
              "AR=llvm-ar"
              "NM=llvm-nm"
              "OBJCOPY=llvm-objcopy"
              "OBJDUMP=llvm-objdump"
              "STRIP=llvm-strip"
              "OBJSIZE=llvm-size"
              "READELF=llvm-readelf"
              "HOSTCC=clang"
              "HOSTCXX=clang++"
              "HOSTAR=llvm-ar"
              "HOSTLD=ld.lld"
              "CLANG_TRIPLE=aarch64-linux-gnu-"
              "KBUILD_BUILD_USER=${KBUILD_BUILD_USER}"
              "KBUILD_BUILD_HOST=${KBUILD_BUILD_HOST}"
            )

            if [[ "${CLEAN_BUILD}" == "true" ]]; then
              echo "=== mrproper ==="
              make "${MAKE_FLAGS[@]}" mrproper
            fi

            echo ""
            echo "=== defconfig: ${DEFCONFIG_PATH} ==="
            make "${MAKE_FLAGS[@]}" "$(basename ${DEFCONFIG_PATH})"

            echo ""
            echo "=== Compiling kernel ==="
            echo "Start: $(date)"
            make "${MAKE_FLAGS[@]}" -j"${THREADS}" 2>&1 | \
              while IFS= read -r line; do
                case "${line}" in
                  *"error:"*|*"fatal:"*|*"Error "*)
                    echo "::error::${line}" ;;
                  *"warning:"*)
                    echo "::warning::${line}" ;;
                esac
                echo "${line}"
              done
            BUILD_RC=${PIPESTATUS[0]}

            if [ ${BUILD_RC} -ne 0 ]; then
              echo "::error::Build failed with exit code ${BUILD_RC}"
              exit 1
            fi
          fi

          echo ""
          echo "Build completed: $(date)"
          echo "Duration: $(( $(date +%s) - ${BUILD_START:-0} ))s"
          echo "BUILD_STATUS=success" >> "$GITHUB_ENV"

      - name: '[8/10] Collect artifacts'
        id: collect
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${KERNEL_ROOT:-.}"
          OUTPUT="${HOME}/kernel_output"
          mkdir -p "${OUTPUT}"

          echo "=== Searching for kernel image ==="
          KERNEL_IMG=""

          for img in \
            "arch/arm64/boot/Image.gz" \
            "arch/arm64/boot/Image.gz-dtb" \
            "arch/arm64/boot/Image" \
            "out/arch/arm64/boot/Image.gz" \
            "out/arch/arm64/boot/Image.gz-dtb" \
            "out/arch/arm64/boot/Image"; do
            if [ -f "${KR}/${img}" ]; then
              KERNEL_IMG="${KR}/${img}"
              echo "Found: ${img}"
              break
            fi
          done

          if [ -z "${KERNEL_IMG}" ] && [ -L "${KR}/out" ]; then
            REAL_OUT=$(readlink -f "${KR}/out")
            for img in arch/arm64/boot/Image.gz arch/arm64/boot/Image.gz-dtb; do
              if [ -f "${REAL_OUT}/${img}" ]; then
                KERNEL_IMG="${REAL_OUT}/${img}"
                echo "Found: ${img} (via symlink)"
                break
              fi
            done
          fi

          if [ -z "${KERNEL_IMG}" ]; then
            KERNEL_IMG=$(find "${KR}" -path "*/arch/arm64/boot/Image.gz*" -type f 2>/dev/null | head -1 || true)
          fi

          if [ -z "${KERNEL_IMG}" ] || [ ! -f "${KERNEL_IMG}" ]; then
            echo "::error::Kernel image not found"
            find "${KR}/arch/arm64/boot" -type f 2>/dev/null || true
            find "${KR}/out" -type f -name "Image*" 2>/dev/null || true
            exit 1
          fi

          cp "${KERNEL_IMG}" "${OUTPUT}/Image.gz"
          echo "Kernel: $(ls -lh "${OUTPUT}/Image.gz" | awk '{print $5}')"

          echo "=== Searching for DTBs/DTBOs ==="
          for dtb_dir in "${KR}/out/arch/arm64/boot/dts" "${KR}/arch/arm64/boot/dts" "${KR}/out/arch/arm64/boot/dts/vendor"; do
            if [ -d "${dtb_dir}" ]; then
              find "${dtb_dir}" -name "*.dtb" -o -name "*.dtbo" | while read -r dtb; do
                cp "${dtb}" "${OUTPUT}/" || true
              done
            fi
          done

          echo "DTBs found: $(find "${OUTPUT}" -name "*.dtb" -o -name "*.dtbo" | wc -l)"

          cat > "${OUTPUT}/build_info.txt" << INFO
Build Information
════════════════════════════════════════════════
Device:         ${DEVICE} (Motorola Moto G45 5G)
SoC:            SM6375 (Snapdragon 6s Gen 3)
Platform:       Holi
Kernel:         ${KERNEL_VERSION:-unknown}
KernelSU-Next:  ${KSU_VERSION}
SUSFS:          ${SUSFS_VERSION}
Compiler:       Proton Clang ${CLANG_VERSION}
Build Date:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')
Build Type:     ${BUILD_TYPE}
Clean Build:    ${CLEAN_BUILD}
Compatibility:  AyakaUI, LineageOS, AOSP, PixelOS
════════════════════════════════════════════════
INFO

          echo "build_info_generated=true" >> "$GITHUB_ENV"

      - name: '[9/10] Package AnyKernel3'
        id: package
        run: |
          set -euo pipefail
          OUTPUT="${HOME}/kernel_output"

          echo "=== Packaging with AnyKernel3 ==="

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/anykernel3

          cd /tmp/anykernel3

          rm -rf .git modules patch ramdisk tools
          rm -f LICENSE README.md

          cp "${OUTPUT}/Image.gz" /tmp/anykernel3/ || true

          cp "${OUTPUT}"/*.dtb /tmp/anykernel3/ 2>/dev/null || true
          cp "${OUTPUT}"/*.dtbo /tmp/anykernel3/ 2>/dev/null || true

          if [ -f /tmp/anykernel3/Image.gz-dtb ]; then
            IMAGE_TYPE="Image.gz-dtb"
          elif [ -f /tmp/anykernel3/Image.gz ]; then
            IMAGE_TYPE="Image.gz"
          else
            IMAGE_TYPE="Image"
          fi
          echo "Image type: ${IMAGE_TYPE}"

          cat > /tmp/anykernel3/anykernel.sh << 'AK3'
##############################
# AnyKernel3 Ramdisk Mod Script
# osm0sis@xda-developers
##############################

## AnyKernel3 attributes
properties() { '
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=fogos
device.name2=Motorola Moto G45 5G
device.name3=moto g45 5g
device.name4=moto g45
'; }

## AnyKernel3 install
block=auto;
is_slot_device=1;
ramdisk_compression=auto;
patch_vtb=0;

## Import patching functions/variables
. tools/ak3-core.sh;

## Install kernel
AK3

          if [ "${IMAGE_TYPE}" = "Image.gz-dtb" ]; then
            cat >> /tmp/anykernel3/anykernel.sh << 'AK3'
flash_boot;
AK3
          else
            cat >> /tmp/anykernel3/anykernel.sh << 'AK3'
split_boot;
flash_boot;
AK3
          fi

          sed -i 's|^  device\.name1=.*|  device.name1=fogos;|' /tmp/anykernel3/anykernel.sh

          BUILD_DATE=$(date +%Y%m%d-%H%M)
          KSU_VER_SAFE=$(echo "${KSU_VERSION}" | tr '/' '-')
          SUSFS_VER_SAFE=$(echo "${SUSFS_VERSION}" | tr '/' '-')
          ZIP_NAME="Kernel-fogos-KSU-${KSU_VER_SAFE}-SUSFS-${SUSFS_VER_SAFE}-${BUILD_DATE}.zip"

          zip -r9 "/tmp/${ZIP_NAME}" . -x '*.git*' -x 'README.md' -x 'LICENSE'

          cp "/tmp/${ZIP_NAME}" "${OUTPUT}/"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_ENV"

          echo ""
          echo "Flashable zip: ${ZIP_NAME}"
          echo "Size: $(ls -lh "${OUTPUT}/${ZIP_NAME}" | awk '{print $5}')"

          cd "${OUTPUT}"
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          echo ""
          echo "SHA256: $(cat "${ZIP_NAME}.sha256")"

          echo ""
          echo "=== Package contents ==="
          unzip -l "${OUTPUT}/${ZIP_NAME}" | head -30

      - name: '[10/10] Verify & upload'
        id: verify
        run: |
          set -euo pipefail
          OUTPUT="${HOME}/kernel_output"

          echo "╔══════════════════════════════════════════╗"
          echo "║         Build Verification               ║"
          echo "╚══════════════════════════════════════════╝"

          ZIP_FILE="${OUTPUT}/${{ env.zip_name }}"
          if [ ! -f "${ZIP_FILE}" ]; then
            echo "::error::Flashable zip not found: ${ZIP_FILE}"
            exit 1
          fi

          ZIP_SIZE=$(stat -c%s "${ZIP_FILE}" 2>/dev/null || stat -f%z "${ZIP_FILE}" 2>/dev/null || echo 0)
          echo "Zip size: ${ZIP_SIZE} bytes"
          if [ "${ZIP_SIZE}" -lt 1000000 ]; then
            echo "::warning::Zip file suspiciously small (< 1MB)"
          fi

          if ! unzip -t "${ZIP_FILE}" >/dev/null 2>&1; then
            echo "::error::Zip file is corrupted"
            exit 1
          fi

          echo "::notice::Packaging successful. Artifact located at ${ZIP_FILE}"

      - name: 'Set job outputs'
        id: set-outputs
        run: |
          echo "KERNEL_VERSION=${KERNEL_VERSION:-unknown}" >> "$GITHUB_ENV"
          echo "BUILD_STATUS=${BUILD_STATUS:-success}" >> "$GITHUB_ENV"
          echo "kernel_version=${KERNEL_VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "build_status=${BUILD_STATUS:-success}" >> "$GITHUB_OUTPUT"
          echo "ksu_version=${KSU_VERSION}" >> "$GITHUB_OUTPUT"
          echo "susfs_version=${SUSFS_VERSION}" >> "$GITHUB_OUTPUT"
