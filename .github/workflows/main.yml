name: Kernel fogos | SukiSU-Ultra + SUSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl wget python3 bc bison \
            build-essential ccache flex \
            libssl-dev libncurses5-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip unzip cpio kmod pahole

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git \
            -b sixteen \
            kernel_src
          echo "=== Kernel version ==="
          head -5 kernel_src/Makefile
          echo "=== Available vendor configs ==="
          ls kernel_src/arch/arm64/configs/vendor/
          echo "=== Ext configs ==="
          ls kernel_src/arch/arm64/configs/vendor/ext_config/ \
            2>/dev/null || echo "no ext_config dir"

      - name: Download Clang toolchain
        run: |
          mkdir clang
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "Clang: $(clang/bin/clang --version | head -1)"

      - name: Setup SukiSU-Ultra (susfs-main branch - non-GKI + SUSFS included)
        run: |
          cd kernel_src
          # susfs-main branch: non-GKI support + SUSFS sudah terintegrated
          # Menggunakan RKSU hook style - tidak ada bug sulog.h
          curl -LSs \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            | bash -s susfs-main
          echo "=== SukiSU-Ultra version ==="
          cat KernelSU/kernel/Makefile | grep "^VERSION\|^PATCHLEVEL" | head -3
          echo "=== KSU driver location ==="
          ls drivers/kernelsu/ 2>/dev/null || ls KernelSU/ || true

      - name: Fix sulog.h - add missing linux/init.h include
        run: |
          # Fix bug di KSU non-GKI: sulog.h missing #include <linux/init.h>
          SULOG="kernel_src/drivers/kernelsu/feature/sulog.h"
          if [ -f "$SULOG" ]; then
            if ! grep -q "linux/init.h" "$SULOG"; then
              sed -i '1s/^/#include <linux\/init.h>\n/' "$SULOG"
              echo "sulog.h patched OK"
            else
              echo "sulog.h already has init.h - OK"
            fi
          else
            echo "sulog.h not found - checking other locations..."
            find kernel_src -name "sulog.h" 2>/dev/null || echo "sulog.h not present"
          fi

      - name: Apply SUSFS patch for kernel 5.4
        run: |
          # Download fixed SUSFS patch untuk kernel 5.4 non-GKI
          wget -q \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_5.4.patch \
            -O susfs_patch.patch

          # Clone SUSFS source files
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b kernel-5.4 susfs_src

          cd kernel_src

          # Copy SUSFS source files ke kernel
          cp ../susfs_src/kernel_patches/fs/susfs.c \
            fs/ 2>/dev/null || true
          cp ../susfs_src/kernel_patches/include/linux/susfs.h \
            include/linux/ 2>/dev/null || true
          cp ../susfs_src/kernel_patches/include/linux/susfs_def.h \
            include/linux/ 2>/dev/null || true
          cp ../susfs_src/kernel_patches/include/linux/sus_su.h \
            include/linux/ 2>/dev/null || true

          # Apply SUSFS patch
          patch -p1 --fuzz=3 < ../susfs_patch.patch \
            && echo "SUSFS patch: CLEAN" \
            || echo "SUSFS patch: applied with warnings (normal untuk non-GKI)"

          # Bersihkan file sisa patch
          find . -name "*.orig" -delete 2>/dev/null || true
          find . -name "*.rej" -delete 2>/dev/null || true

      - name: Generate defconfig for fogos
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export ARCH=arm64

          MAKE_ARGS="O=../out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"

          echo ">>> Step 1: Base holi-qgki defconfig"
          make $MAKE_ARGS vendor/holi-qgki_defconfig

          echo ">>> Step 2: Merge fogos-specific ext configs"
          for cfg in \
            arch/arm64/configs/vendor/ext_config/moto-holi.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config; do
            if [ -f "$cfg" ]; then
              echo "  Merging: $cfg"
              ./scripts/kconfig/merge_config.sh \
                -m -O ../out ../out/.config "$cfg"
            else
              echo "  Skip: $cfg not found"
            fi
          done

          echo ">>> Step 3: Set KSU + SUSFS + LTO configs"
          ./scripts/config --file ../out/.config \
            -e KSU \
            -d KSU_WITH_KPROBES \
            -e KSU_MANUAL_HOOK \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -d KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -d KSU_SUSFS_SUS_SU \
            -e LTO_NONE \
            -d LTO_CLANG \
            -e RELR

          echo ">>> Step 4: olddefconfig (pipe yes untuk semua prompt)"
          yes "" | make $MAKE_ARGS olddefconfig

          echo "=== Verifikasi final config ==="
          echo "--- KSU ---"
          grep "CONFIG_KSU" ../out/.config || echo "WARNING: CONFIG_KSU tidak ada!"
          echo "--- SUSFS ---"
          grep "CONFIG_KSU_SUSFS" ../out/.config | head -5 || echo "WARNING: SUSFS config tidak ada!"
          echo "--- LTO ---"
          grep "CONFIG_LTO" ../out/.config

      - name: Build kernel
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          echo ">>> Build dengan $(nproc) threads..."
          yes "" | make -j$(nproc) \
            O=../out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz 2>&1 | tee ../build.log

          echo ">>> Cek hasil build..."
          if [ -f ../out/arch/arm64/boot/Image.gz ]; then
            echo "=============================="
            echo "BUILD SUCCESS!"
            ls -lh ../out/arch/arm64/boot/Image.gz
            echo "=============================="
          else
            echo "BUILD FAILED - Last 100 lines:"
            tail -100 ../build.log
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git ak3

          cp out/arch/arm64/boot/Image.gz ak3/

          cat > ak3/anykernel.sh << 'EOF'
          # AnyKernel3 - fogos (Moto G34/G45 5G)
          # SukiSU-Ultra + SUSFS
          properties() { '
          kernel.string=SukiSU-Ultra + SUSFS | fogos | AyakaUI
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fogos
          device.name2=XT2363-2
          device.name3=XT2363-3
          device.name4=XT2363-5
          device.name5=XT2349-1
          device.name6=moto g45 5G
          device.name7=moto g34 5G
          '; }
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          . tools/ak3-core.sh
          . tools/repacktools.sh
          . tools/repack.sh
          EOF

          DATE=$(date +%Y%m%d-%H%M)
          ZIP="kernel-fogos-sukisu-susfs-${DATE}.zip"
          cd ak3
          zip -r9 "../${ZIP}" . -x ".git/*" "README.md"
          cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          echo "ZIP siap: ${ZIP}"
          ls -lh "${ZIP}"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fogos-sukisu-susfs-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: Build summary
        if: success()
        run: |
          echo "================================"
          echo "BUILD SUKSES!"
          echo "KSU: SukiSU-Ultra susfs-main"
          echo "SUSFS: JackA1ltman fixed patch"
          echo "Device: fogos (Moto G34/G45 5G)"
          echo "ZIP: ${{ env.ZIP_NAME }}"
          echo "================================"
