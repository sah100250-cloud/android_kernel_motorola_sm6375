name: Build Fogos - Manual Patching (Fail-Fast)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: AyakaUI/android_kernel_motorola_sm6375
          ref: lineage-21.0
          path: kernel-source

      - name: Apply SUSFS 2.1.0 Manual Patch
        run: |
          cd kernel-source
          # Gunakan branch legacy_susfs_v2 dari fork sidex15
          git clone -b legacy_susfs_v2 https://github.com/sidex15/susfs4ksu.git ../susfs_repo
          
          # Salin file ke target KSU (RKSU/KernelSU-Next)
          cp ../susfs_repo/kernel/susfs.c drivers/kernelsu/
          cp ../susfs_repo/kernel/susfs.h drivers/kernelsu/
          
          # Terapkan patch 5.4 spesifik
          patch -p1 < ../susfs_repo/kernel/susfs_patch_to_5.4.patch || exit 1
          
          # Fix Header pgtable
          sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g' drivers/kernelsu/feature/sucompat.c

      - name: Compile with Fail-Fast
        run: |
          cd kernel-source
          make O=out ARCH=arm64 fogos_defconfig
          make -j$(nproc) O=out ARCH=arm64 --keep-going=false || exit 1
          
