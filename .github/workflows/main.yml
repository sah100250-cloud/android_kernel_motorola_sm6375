name: Build Kernel — Moto G45 5G (fogos) - minimal 5.4 workflow

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU-Next version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      susfs_version:
        description: 'SUSFS version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      clang_version:
        description: 'Proton Clang version (17/18/19)'
        required: false
        default: '18'
        type: choice
        options:
          - '17'
          - '18'
          - '19'
      clean_build:
        description: 'Force clean build'
        required: false
        default: true
        type: boolean

env:
  # adjust only if you intentionally want a different repo/branch
  KERNEL_REPO: AnandSuresh02/android_kernel_motorola_sm6375
  KERNEL_BRANCH: main
  DEVICE: fogos

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build & Package Kernel (minimal, 5.4-focused)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev libncurses-dev libssl-dev lz4 make openssl \
            perl python3 python3-pip xz-utils ccache zip unzip \
            device-tree-compiler zstd libelf-dev libudev-dev \
            wget curl git

      - name: Prepare workspace & inputs
        run: |
          set -euo pipefail
          mkdir -p build/output
          echo "WORKDIR=build" >> $GITHUB_ENV
          echo "OUTPUTDIR=build/output" >> $GITHUB_ENV
          echo "KSU_VERSION=${{ github.event.inputs.ksu_version }}" >> $GITHUB_ENV
          echo "SUSFS_VERSION=${{ github.event.inputs.susfs_version }}" >> $GITHUB_ENV
          echo "CLANG_VERSION=${{ github.event.inputs.clang_version }}" >> $GITHUB_ENV
          echo "CLEAN_BUILD=${{ github.event.inputs.clean_build }}" >> $GITHUB_ENV
          echo "KERNEL_REPO=${{ env.KERNEL_REPO }}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${{ env.KERNEL_BRANCH }}" >> $GITHUB_ENV
          echo "DEVICE=${{ env.DEVICE }}" >> $GITHUB_ENV

      - name: Build script (inline) — integrates KSU/SUSFS and builds (5.4)
        env:
          WORKDIR: ${{ env.WORKDIR }}
          OUTPUTDIR: ${{ env.OUTPUTDIR }}
          KSU_VERSION: ${{ env.KSU_VERSION }}
          SUSFS_VERSION: ${{ env.SUSFS_VERSION }}
          CLANG_VERSION: ${{ env.CLANG_VERSION }}
          CLEAN_BUILD: ${{ env.CLEAN_BUILD }}
          KERNEL_REPO: ${{ env.KERNEL_REPO }}
          KERNEL_BRANCH: ${{ env.KERNEL_BRANCH }}
          DEVICE: ${{ env.DEVICE }}
        run: |
          set -euo pipefail
          echo "Workspace: $WORKDIR ; Output: $OUTPUTDIR"
          # prepare directories
          rm -rf "$WORKDIR" || true
          mkdir -p "$WORKDIR" "$OUTPUTDIR"
          cd "$WORKDIR"

          # Try to download Proton Clang (best-effort). If fails, we'll use cross gcc.
          CLANG_DIR="${HOME}/proton-clang-${CLANG_VERSION}"
          mkdir -p "$CLANG_DIR"
          PRIMARY="https://github.com/nicofork/proton-clang/releases/download/clang-${CLANG_VERSION}/proton-clang-${CLANG_VERSION}.tar.zst"
          BACKUP="https://gitlab.com/nicofork/proton-clang/-/archive/clang-${CLANG_VERSION}/proton-clang-clang-${CLANG_VERSION}.tar.gz"
          if wget -q --show-progress "$PRIMARY" -O /tmp/clang.tar.zst 2>/dev/null; then
            if command -v zstd >/dev/null 2>&1; then
              zstd -d /tmp/clang.tar.zst --stdout | tar xf - -C "$CLANG_DIR" --strip-components=1 || true
            else
              tar xf /tmp/clang.tar.zst -C "$CLANG_DIR" --strip-components=1 2>/dev/null || true
            fi
            rm -f /tmp/clang.tar.zst
            export PATH="$CLANG_DIR/bin:$PATH"
            echo "Proton Clang installed to $CLANG_DIR"
          else
            echo "Proton Clang not available: will fallback to system cross compilers"
          fi

          # Clone kernel
          rm -rf kernel_source
          git clone --depth=1 -b "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel_source
          cd kernel_source || exit 1

          # detect kernel root
          if [ -d "kernel_src" ]; then
            KERNEL_ROOT="kernel_src"
          elif [ -f "Makefile" ] && grep -q "^VERSION" Makefile 2>/dev/null; then
            KERNEL_ROOT="."
          else
            KERNEL_ROOT="."
          fi
          echo "Detected KERNEL_ROOT: $KERNEL_ROOT"

          # Integrate KernelSU-Next (best-effort copy)
          TMPKSU="/tmp/ksu_next_src"
          rm -rf "$TMPKSU" || true
          if [ "$KSU_VERSION" = "latest" ]; then
            git clone --depth=1 "https://github.com/KernelSU-Next/KernelSU-Next.git" "$TMPKSU" || true
          else
            git clone --depth=1 -b "$KSU_VERSION" "https://github.com/KernelSU-Next/KernelSU-Next.git" "$TMPKSU" || true
          fi
          if [ -d "$TMPKSU/kernel" ]; then
            cp -r "$TMPKSU/kernel" "${KERNEL_ROOT}/KernelSU" || true
            echo "KernelSU kernel files copied"
          else
            echo "KernelSU kernel dir not found: will enable CONFIG_KSU in defconfig"
          fi
          rm -rf "$TMPKSU" || true

          # Apply SUSFS (best-effort)
          TMPSUS="/tmp/susfs_src"
          rm -rf "$TMPSUS" || true
          if [ "$SUSFS_VERSION" = "latest" ]; then
            git clone --depth=1 "https://github.com/sidex15/susfs4ksu-module.git" "$TMPSUS" || true
          else
            git clone --depth=1 -b "$SUSFS_VERSION" "https://github.com/sidex15/susfs4ksu-module.git" "$TMPSUS" || true
          fi
          if [ -d "$TMPSUS/kernel" ]; then
            cp -rv "$TMPSUS/kernel/"* "${KERNEL_ROOT}/" 2>/dev/null || true
          fi
          if [ -d "$TMPSUS/susfs" ]; then
            cp -rv "$TMPSUS/susfs" "${KERNEL_ROOT}/susfs" 2>/dev/null || true
          fi
          rm -rf "$TMPSUS" || true

          # Find defconfig (5.4-oriented search)
          cd "$KERNEL_ROOT"
          DEFCONF=""
          for try in \
            "arch/arm64/configs/vendor/${DEVICE}_defconfig" \
            "arch/arm64/configs/vendor/${DEVICE}" \
            "arch/arm64/configs/vendor/sm6375_${DEVICE}_defconfig" \
            "arch/arm64/configs/${DEVICE}_defconfig" \
            "arch/arm64/configs/*${DEVICE}*" \
            "arch/arm64/configs/*sm6375*"; do
            found=$(ls $try 2>/dev/null || true)
            if [ -n "$found" ]; then
              DEFCONF="$found"
              break
            fi
          done
          if [ -z "$DEFCONF" ]; then
            DEFCONF=$(find arch/arm64/configs -type f -name "*defconfig" -iname "*${DEVICE}*" -o -iname "*sm6375*" 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$DEFCONF" ]; then
            echo "::error::Defconfig not found; aborting"
            exit 1
          fi
          echo "Using defconfig: $DEFCONF"
          cp "$DEFCONF" "${DEFCONF}.bak" || true

          # Append safe 5.4 KSU/SUSFS options (manual hook)
          # Keep this minimal and safe for 5.4 trees
          printf '\n%s\n' "# Injected KSU/SUSFS (CI)" \
            "CONFIG_KSU=y" \
            "CONFIG_KPROBES=y" \
            "CONFIG_HAVE_KPROBES=y" \
            "CONFIG_UPROBES=y" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_KSU_SUSFS_SUS_PATH=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_MODULES=y" \
            "CONFIG_EXT4_FS=y" \
            >> "$DEFCONF"
          awk '!seen[$0]++ || /^#/' "$DEFCONF" > /tmp/def.dedup || true
          mv /tmp/def.dedup "$DEFCONF" || true
          echo "Defconfig patched."

          # Build (prefer clang if available, else fallback)
          export ARCH=arm64
          export SUBARCH=arm64
          if command -v clang >/dev/null 2>&1; then
            export CC=clang
            echo "Using clang for build"
          else
            export CC=aarch64-linux-gnu-gcc || true
            echo "::warning::clang not found; using cross gcc if present"
          fi

          # determine defconfig basename
          DEFBASE=$(basename "$DEFCONF")
          if [ "${CLEAN_BUILD}" = "true" ] || [ "${CLEAN_BUILD}" = "True" ]; then
            make ARCH=arm64 mrproper || true
          fi
          make ARCH=arm64 "$DEFBASE"
          make ARCH=arm64 -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}; if [ $rc -ne 0 ]; then
            tail -n 200 build.log || true
            echo "::error::Build failed (exit $rc)"
            exit $rc
          fi
          # Collect artifacts
          mkdir -p "$GITHUB_WORKSPACE/$OUTPUTDIR"
          IMG=$(find . -path "*/arch/arm64/boot/Image*" -type f 2>/dev/null | head -n1 || true)
          if [ -z "$IMG" ]; then echo "::error::Image not found"; exit 1; fi
          cp "$IMG" "$GITHUB_WORKSPACE/$OUTPUTDIR/Image.gz" || cp "$IMG" "$GITHUB_WORKSPACE/$OUTPUTDIR/Image" || true
          find . -path "*/arch/arm64/boot/dts*" -name "*.dtb" -o -name "*.dtbo" -print0 | xargs -0 -I{} cp {} "$GITHUB_WORKSPACE/$OUTPUTDIR/" || true

          # Minimal packaging (AnyKernel3)
          AK="/tmp/anykernel"
          rm -rf "$AK"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK" || true
          cp "$GITHUB_WORKSPACE/$OUTPUTDIR"/Image* "$AK/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/$OUTPUTDIR"/*.dtb "$AK/" 2>/dev/null || true
          cd "$AK" || true
          ZIP="kernel-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "/tmp/$ZIP" . -x '*.git*' -x 'README.md' -x 'LICENSE' || true
          mv "/tmp/$ZIP" "$GITHUB_WORKSPACE/$OUTPUTDIR/" || true
          sha256sum "$GITHUB_WORKSPACE/$OUTPUTDIR/$ZIP" > "$GITHUB_WORKSPACE/$OUTPUTDIR/$ZIP.sha256" || true
          echo "Packaged to $GITHUB_WORKSPACE/$OUTPUTDIR/$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: build/output/*.zip
