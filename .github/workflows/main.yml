# .github/workflows/build-kernel-fogos.yml
# Build Kernel Motorola G45 5G (fogos) — SM6375 / Snapdragon 6s Gen 3
# KernelSU Next + SUSFS | Kompatibel: AyakaUI, LineageOS, AOSP
#
# Referensi:
# - SM6375 Kernel: github.com/AnandSuresh02/android_kernel_motorola_sm6375
# - Device Tree: github.com/Motorola-SM6375-Devs
# - KSU Next: github.com/KernelSU-Next/KernelSU-Next
# - SUSFS: github.com/sidex15/susfs4ksu-module

name: 'Build Kernel — Moto G45 5G (fogos)'

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU-Next version'
        required: false
        default: 'latest'
        type: string
      susfs_version:
        description: 'SUSFS version (tag)'
        required: false
        default: 'latest'
        type: string
      clang_version:
        description: 'Proton Clang version'
        required: false
        default: '18'
        type: choice
        options:
          - '17'
          - '18'
          - '19'
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      clean_build:
        description: 'Force clean build'
        required: false
        default: true
        type: boolean

  schedule:
    - cron: '0 2 * * 1'

  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-kernel-fogos.yml'

env:
  KERNEL_REPO: 'AnandSuresh02/android_kernel_motorola_sm6375'
  KERNEL_BRANCH: 'main'
  KERNEL_SRC: 'kernel_src'
  DEVICE: 'fogos'
  PLATFORM: 'holi'
  SM6375_PLATFORM: 'true'
  TZ: 'Asia/Jakarta'

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  #  JOB 1: Resolve versi terbaru, setup matrix
  # ═══════════════════════════════════════════════════════════
  resolve-versions:
    name: 'Resolve Latest Versions'
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.ksu_version == 'latest' ||
      github.event.inputs.susfs_version == 'latest'
    outputs:
      ksu_version: ${{ steps.resolve.outputs.ksu_version }}
      susfs_version: ${{ steps.resolve.outputs.susfs_version }}
    steps:
      - name: Resolve latest stable versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Resolving latest versions ==="

          # ── KernelSU-Next ──
          if [[ "${{ github.event.inputs.ksu_version || 'latest' }}" == "latest" ]]; then
            KSU_VER=$(gh api repos/KernelSU-Next/KernelSU-Next/releases/latest \
              --jq '.tag_name' 2>/dev/null || echo "v1.0.5")
          else
            KSU_VER="${{ github.event.inputs.ksu_version }}"
          fi
          echo "ksu_version=${KSU_VER}" >> "$GITHUB_OUTPUT"
          echo "  KernelSU-Next: ${KSU_VER}"

          # ── SUSFS ──
          if [[ "${{ github.event.inputs.susfs_version || 'latest' }}" == "latest" ]]; then
            SUSFS_VER=$(gh api repos/sidex15/susfs4ksu-module/releases/latest \
              --jq '.tag_name' 2>/dev/null || echo "v1.5.2")
          else
            SUSFS_VER="${{ github.event.inputs.susfs_version }}"
          fi
          echo "susfs_version=${SUSFS_VER}" >> "$GITHUB_OUTPUT"
          echo "  SUSFS: ${SUSFS_VER}"

          echo "=== Version resolution complete ==="

  # ═══════════════════════════════════════════════════════════
  #  JOB 2: Build Kernel
  # ═══════════════════════════════════════════════════════════
  build:
    name: 'Build ${{ env.DEVICE }} kernel'
    needs: [resolve-versions]
    if: always() && (needs.resolve-versions.result == 'success' || needs.resolve-versions.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      kernel_version: ${{ steps.info.outputs.kernel_version }}
      build_status: ${{ steps.info.outputs.build_status }}
      ksu_version: ${{ steps.info.outputs.ksu_version }}
      susfs_version: ${{ steps.info.outputs.susfs_version }}

    env:
      KSU_VERSION: >-
        ${{
          needs.resolve-versions.outputs.ksu_version ||
          github.event.inputs.ksu_version ||
          'v1.0.5'
        }}
      SUSFS_VERSION: >-
        ${{
          needs.resolve-versions.outputs.susfs_version ||
          github.event.inputs.susfs_version ||
          'v1.5.2'
        }}
      CLANG_VERSION: ${{ github.event.inputs.clang_version || '18' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'true' }}
      KBUILD_BUILD_USER: 'fogos-ci'
      KBUILD_BUILD_HOST: 'github-actions'
      BUILD_START: ''

    steps:
      # ───────────────────────────────────────────────────
      #  1. Setup Build Environment
      # ───────────────────────────────────────────────────
      - name: '[1/10] Setup build environment'
        id: setup
        run: |
          set -euo pipefail
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

          echo "╔══════════════════════════════════════════╗"
          echo "║  Kernel Build: Motorola G45 5G (fogos)   ║"
          echo "║  SoC: SM6375 (Snapdragon 6s Gen 3)       ║"
          echo "║  Platform: Holi                           ║"
          echo "║  KSU: ${{ env.KSU_VERSION }}             ║"
          echo "║  SUSFS: ${{ env.SUSFS_VERSION }}         ║"
          echo "║  Clang: ${{ env.CLANG_VERSION }}         ║"
          echo "╚══════════════════════════════════════════╝"

          sudo apt-get update -qq
          sudo apt-get install -yqq \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev libssl-dev lz4 libncurses5 make openssl \
            perl python3 python3-pip xz-utils ccache zip \
            device-tree-compiler zstd libelf-dev libudev-dev \
            wget curl jq

          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap: $(free -h | grep Swap | awk '{print $2}')"

          ccache -M 10G
          ccache -z
          echo "ccache_stats=$(ccache -s | grep 'cache hit' | head -1)" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────
      #  2. Setup Proton Clang Toolchain
      # ───────────────────────────────────────────────────
      - name: '[2/10] Setup Proton Clang'
        id: clang
        run: |
          set -euo pipefail
          CLANG_DIR="${HOME}/proton-clang-${{ env.CLANG_VERSION }}"
          echo "CLANG_DIR=${CLANG_DIR}" >> "$GITHUB_ENV"

          CLANG_URL="https://github.com/nicofork/proton-clang/releases/download/clang-${{ env.CLANG_VERSION }}/proton-clang-${{ env.CLANG_VERSION }}.tar.zst"

          echo "Downloading Proton Clang ${{ env.CLANG_VERSION }}..."
          if ! wget -q --show-progress "${CLANG_URL}" -O /tmp/clang.tar.zst 2>/dev/null; then
            echo "::warning::Proton Clang ${{ env.CLANG_VERSION }} download failed, trying backup..."
            CLANG_URL="https://gitlab.com/nicofork/proton-clang/-/archive/clang-${{ env.CLANG_VERSION }}/proton-clang-clang-${{ env.CLANG_VERSION }}.tar.gz"
            wget -q "${CLANG_URL}" -O /tmp/clang.tar.gz
            mkdir -p "${CLANG_DIR}"
            tar xf /tmp/clang.tar.gz -C "${CLANG_DIR}" --strip-components=1
            rm -f /tmp/clang.tar.gz
          else
            mkdir -p "${CLANG_DIR}"
            zstd -d /tmp/clang.tar.zst --stdout | tar xf - -C "${CLANG_DIR}" --strip-components=1
            rm -f /tmp/clang.tar.zst
          fi

          export PATH="${CLANG_DIR}/bin:${PATH}"

          if ! clang --version >/dev/null 2>&1; then
            echo "::error::Clang verification failed"
            exit 1
          fi

          echo "Clang: $(clang --version | head -1)"

          # Aarch64 GCC (backup cross-compiler)
          GCC64_DIR="${HOME}/gcc-aarch64"
          mkdir -p "${GCC64_DIR}"
          wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.0.0_r1.tar.gz" \
            -O /tmp/gcc64.tar.gz || true
          if [ -f /tmp/gcc64.tar.gz ] && [ -s /tmp/gcc64.tar.gz ]; then
            tar xf /tmp/gcc64.tar.gz -C "${GCC64_DIR}"
            rm -f /tmp/gcc64.tar.gz
            echo "GCC64: $(ls ${GCC64_DIR}/bin/ 2>/dev/null | head -3)"
          fi

      # ───────────────────────────────────────────────────
      #  3. Checkout & Prepare Kernel Source
      # ───────────────────────────────────────────────────
      - name: '[3/10] Checkout kernel source'
        id: checkout
        run: |
          set -euo pipefail

          echo "Cloning ${{ env.KERNEL_REPO }} (branch: ${{ env.KERNEL_BRANCH }})..."
          git clone --depth=1 \
            -b "${{ env.KERNEL_BRANCH }}" \
            "https://github.com/${{ env.KERNEL_REPO }}.git" \
            kernel_source

          cd kernel_source

          # Detect kernel source structure
          if [ -d "${{ env.KERNEL_SRC }}" ]; then
            echo "KERNEL_ROOT=${{ env.KERNEL_SRC }}" >> "$GITHUB_ENV"
            echo "Using kernel source at: ${{ env.KERNEL_SRC }}"
          elif [ -f "Makefile" ] && grep -q "VERSION" Makefile 2>/dev/null; then
            echo "KERNEL_ROOT=." >> "$GITHUB_ENV"
            echo "Using kernel source at: ."
          else
            echo "KERNEL_ROOT=." >> "$GITHUB_ENV"
            echo "::warning::Kernel source structure unclear, using root"
          fi

          # Extract kernel version
          KVERSION=$(grep -m1 "^VERSION" Makefile | awk '{print $3}')
          KPATCHLEVEL=$(grep -m1 "^PATCHLEVEL" Makefile | awk '{print $3}')
          KSUBLEVEL=$(grep -m1 "^SUBLEVEL" Makefile | awk '{print $3}')
          FULL_VERSION="${KVERSION}.${KPATCHLEVEL}.${KSUBLEVEL}"
          echo "kernel_version=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "Kernel version: ${FULL_VERSION}"

          # Log SM6375/Holi platform info
          echo ""
          echo "Platform: SM6375 (Holi) — Snapdragon 6s Gen 3"
          echo "Device: ${{ env.DEVICE }} (Moto G45 5G)"
          echo "Camera: DLKM (Holi Spectra Camera)"
          echo "Compiler: Proton Clang ${{ env.CLANG_VERSION }}"

      # ───────────────────────────────────────────────────
      #  4. Integrate KernelSU-Next
      # ───────────────────────────────────────────────────
      - name: '[4/10] Integrate KernelSU-Next'
        id: ksu
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${{ env.KERNEL_ROOT }}"

          KSU_REPO="KernelSU-Next/KernelSU-Next"
          KSU_TAG="${{ env.KSU_VERSION }}"
          KSU_TMP="/tmp/ksu-next"
          KSU_KERNEL="${KR}/KernelSU"

          echo "=== KernelSU-Next ${KSU_TAG} ==="
          echo "Repository: ${KSU_REPO}"
          echo "Target: ${KSU_KERNEL}"

          mkdir -p "${KSU_TMP}"

          # Download release
          RELEASE_JSON=$(gh api "repos/${KSU_REPO}/releases/tags/${KSU_TAG}" 2>/dev/null || \
                         gh api "repos/${KSU_REPO}/releases/latest" 2>/dev/null)
          echo "${RELEASE_JSON}" | jq -r '.tag_name' > /tmp/ksu_version.txt
          ACTUAL_KSU_VER=$(cat /tmp/ksu_version.txt)
          echo "Resolved version: ${ACTUAL_KSU_VER}"
          echo "ksu_version=${ACTUAL_KSU_VER}" >> "$GITHUB_ENV"

          TARBALL_URL=$(echo "${RELEASE_JSON}" | \
            jq -r '.assets[] | select(.name | test(".*\\.tar\\.gz$|.*\\.source.*")) | .browser_download_url' | head -1)

          if [ -z "${TARBALL_URL}" ] || [ "${TARBALL_URL}" == "null" ]; then
            echo "No release tarball found, using git clone..."
            git clone --depth=1 -b "${ACTUAL_KSU_VER}" \
              "https://github.com/${KSU_REPO}.git" "${KSU_TMP}"
          else
            wget -q "${TARBALL_URL}" -O "${KSU_TMP}/ksu.tar.gz"
            mkdir -p "${KSU_TMP}/extracted"
            tar xf "${KSU_TMP}/ksu.tar.gz" -C "${KSU_TMP}/extracted" --strip-components=0
          fi

          # Copy kernel patches
          KSU_SRC="${KSU_TMP}"
          [ -d "${KSU_TMP}/extracted" ] && KSU_SRC="${KSU_TMP}/extracted"

          rm -rf "${KSU_KERNEL}"
          if [ -d "${KSU_SRC}/kernel" ]; then
            cp -r "${KSU_SRC}/kernel" "${KSU_KERNEL}"
          elif [ -f "${KSU_SRC}/setup.sh" ]; then
            cp -r "${KSU_SRC}" "${KSU_KERNEL}"
          else
            echo "::error::KernelSU kernel source not found"
            ls -la "${KSU_SRC}/"
            exit 1
          fi

          rm -rf "${KSU_TMP}"

          echo "KernelSU-Next integrated at: ${KSU_KERNEL}"
          echo "Contents:"
          ls -la "${KSU_KERNEL}/"

          # Verify Kconfig exists
          if [ ! -f "${KSU_KERNEL}/Kconfig" ] && [ ! -f "${KSU_KERNEL}/kernel/Kconfig" ]; then
            echo "::warning::Kconfig not found — KSU may not integrate automatically"
            echo "Will enable CONFIG_KSU manually in defconfig"
          fi

          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ───────────────────────────────────────────────────
      #  5. Apply SUSFS Patches
      # ───────────────────────────────────────────────────
      - name: '[5/10] Apply SUSFS patches'
        id: susfs
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${{ env.KERNEL_ROOT }}"

          SUSFS_REPO="sidex15/susfs4ksu-module"
          SUSFS_TAG="${{ env.SUSFS_VERSION }}"

          echo "=== SUSFS ${SUSFS_TAG} ==="
          echo "Repository: ${SUSFS_REPO}"

          SUSFS_TMP="/tmp/susfs-source"
          git clone --depth=1 -b "${SUSFS_TAG}" \
            "https://github.com/${SUSFS_REPO}.git" \
            "${SUSFS_TMP}" || \
          git clone --depth=1 \
            "https://github.com/${SUSFS_REPO}.git" \
            "${SUSFS_TMP}"

          ACTUAL_SUSFS_VER=$(cd "${SUSFS_TMP}" && git describe --tags 2>/dev/null || echo "${SUSFS_TAG}")
          echo "susfs_version=${ACTUAL_SUSFS_VER}" >> "$GITHUB_ENV"
          echo "Resolved SUSFS version: ${ACTUAL_SUSFS_VER}"

          # ── Apply SUSFS kernel source patches ──
          SUSFS_APPLIED=false

          # Method 1: Apply patch files
          if ls "${SUSFS_TMP}"/patches/*.patch 1>/dev/null 2>&1; then
            echo "Applying SUSFS patch files..."
            for patch in "${SUSFS_TMP}"/patches/*.patch; do
              echo "  Patch: $(basename "${patch}")"
              if git apply --check "${patch}" 2>/dev/null; then
                git apply "${patch}"
                echo "  Applied successfully"
                SUSFS_APPLIED=true
              else
                echo "::warning::Patch $(basename "${patch}") does not apply cleanly, trying with -p1..."
                if git apply --check -p1 "${patch}" 2>/dev/null; then
                  git apply -p1 "${patch}"
                  echo "  Applied with -p1"
                  SUSFS_APPLIED=true
                else
                  echo "::warning::Skipping incompatible patch: $(basename "${patch}")"
                fi
              fi
            done
          fi

          # Method 2: Copy SUSFS source files
          if [ -d "${SUSFS_TMP}/kernel" ]; then
            echo "Copying SUSFS kernel source files..."
            cp -rv "${SUSFS_TMP}/kernel/"* "${KR}/" 2>/dev/null || true
            SUSFS_APPLIED=true
          fi

          # Method 3: Apply KSU patch
          if [ -f "${SUSFS_TMP}/ksu_patch.patch" ]; then
            echo "Applying KSU SUSFS patch..."
            if git apply --check "${SUSFS_TMP}/ksu_patch.patch" 2>/dev/null; then
              git apply "${SUSFS_TMP}/ksu_patch.patch"
              SUSFS_APPLIED=true
            else
              echo "::warning::KSU patch did not apply cleanly"
            fi
          fi

          # Method 4: Copy SUSFS module source
          if [ -d "${SUSFS_TMP}/susfs" ]; then
            echo "Copying SUSFS module source..."
            cp -rv "${SUSFS_TMP}/susfs" "${KR}/susfs" 2>/dev/null || true
          fi

          if [ "${SUSFS_APPLIED}" = true ]; then
            echo "SUSFS patches applied successfully"
          else
            echo "::warning::No SUSFS patches could be applied — SUSFS will be enabled via defconfig only"
          fi

          rm -rf "${SUSFS_TMP}"

          # Verify SUSFS source presence
          if [ -d "${KR}/fs/susfs" ] || [ -f "${KR}/fs/susfs.c" ] || \
             [ -f "${KR}/include/linux/susfs.h" ] || [ -f "${KR}/include/linux/susfs_types.h" ]; then
            echo "SUSFS kernel source: FOUND"
          else
            echo "::warning::SUSFS kernel source not found — CONFIG_KSU_SUSFS may need manual integration"
          fi

      # ───────────────────────────────────────────────────
      #  6. Configure Defconfig
      # ───────────────────────────────────────────────────
      - name: '[6/10] Configure defconfig'
        id: defconfig
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${{ env.KERNEL_ROOT }}"

          echo "=== Searching for ${{ env.DEVICE }} defconfig ==="

          # Search for defconfig
          DEFCONFIG_PATH=""
          for pattern in \
            "vendor/${{ env.DEVICE }}_defconfig" \
            "vendor/${{ env.DEVICE }}" \
            "vendor/sm6375_${{ env.DEVICE }}_defconfig" \
            "vendor/sm6375_defconfig" \
            "${{ env.DEVICE }}_defconfig" \
            "vendor/qcom/${{ env.DEVICE }}_defconfig" \
            "vendor/qcom/sdm6375_${{ env.DEVICE }}_defconfig"; do
            if [ -f "${KR}/arch/arm64/configs/${pattern}" ]; then
              DEFCONFIG_PATH="arch/arm64/configs/${pattern}"
              break
            fi
          done

          # Fallback search
          if [ -z "${DEFCONFIG_PATH}" ]; then
            DEFCONFIG_PATH=$(find "${KR}/arch/arm64/configs" -type f \
              $$ -name "*{{ env.DEVICE }}*" -o -name "*fogos*" -o -name "*holi*sm6375*" \)$$ \
              2>/dev/null | head -1 | sed "s|${KR}/||")
          fi

          if [ -z "${DEFCONFIG_PATH}" ]; then
            echo ""
            echo "Available defconfigs:"
            find "${KR}/arch/arm64/configs" -type f -name "*defconfig" 2>/dev/null | \
              sed "s|${KR}/||" | sort
            echo "::error::Defconfig for ${{ env.DEVICE }} not found"
            exit 1
          fi

          echo "Defconfig: ${DEFCONFIG_PATH}"
          echo "defconfig_path=${DEFCONFIG_PATH}" >> "$GITHUB_ENV"

          # Backup
          cp "${KR}/${DEFCONFIG_PATH}" "${KR}/${DEFCONFIG_PATH}.bak"

          # ── Inject KSU + SUSFS Config ──
          echo ""
          echo "=== Injecting KSU Next + SUSFS config ==="

          # Existing config options
          EXISTING_KSU=$(grep -c "^CONFIG_KSU" "${KR}/${DEFCONFIG_PATH}" 2>/dev/null || echo "0")
          EXISTING_KPROBES=$(grep -c "^CONFIG_KPROBES=y" "${KR}/${DEFCONFIG_PATH}" 2>/dev/null || echo "0")
          echo "Existing KSU options: ${EXISTING_KSU}"
          echo "Existing KPROBES: ${EXISTING_KPROBES}"

          # Append KSU + SUSFS config block
          cat >> "${KR}/${DEFCONFIG_PATH}" << 'KSU_SUSFS_CONFIG'

# ┌──────────────────────────────────────────┐
# │  KernelSU-Next + SUSFS Configuration     │
# │  Device: fogos (Moto G45 5G)             │
# │  SM6375 / Snapdragon 6s Gen 3            │
# └──────────────────────────────────────────┘

# ── KernelSU-Next ──
CONFIG_KSU=y

# ── Kprobes (required by KSU) ──
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBES_ON_FTRACE=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_UPROBE_EVENTS=y

# ── SUSFS (Full Feature Set) ──
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNTS=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNTS=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG=y
CONFIG_KSU_SUSFS_ADD_SUS_SU=y
CONFIG_KSU_SUSFS_AVC_SPOOF=y

# ── Module support ──
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODULE_FORCE_UNLOAD=y
CONFIG_MODULE_SIG=y

# ── EXT4 support ──
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_EXT4_USE_FOR_EXT2=y
KSU_SUSFS_CONFIG

          # Remove duplicates (keep last occurrence)
          awk '!seen[$0]++ || /^#/' "${KR}/${DEFCONFIG_PATH}" > /tmp/defconfig_clean
          mv /tmp/defconfig_clean "${KR}/${DEFCONFIG_PATH}"

          # ── Verify Config Injection ──
          echo ""
          echo "=== Verifying config injection ==="
          for cfg in \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_AVC_SPOOF=y \
            CONFIG_KPROBES=y \
            CONFIG_MODULES=y \
            CONFIG_EXT4_FS=y; do
            if grep -q "^${cfg}$" "${KR}/${DEFCONFIG_PATH}"; then
              echo "  ✓ ${cfg}"
            else
              echo "  ✗ ${cfg} — MISSING"
            fi
          done

          echo ""
          echo "=== Full KSU/SUSFS config in defconfig ==="
          grep -E "^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES|CONFIG_EXT4)" \
            "${KR}/${DEFCONFIG_PATH}" | sort -u

      # ───────────────────────────────────────────────────
      #  7. Build Kernel
      # ───────────────────────────────────────────────────
      - name: '[7/10] Build kernel'
        id: build
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${{ env.KERNEL_ROOT }}"
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"

          # Set build variables
          DEFCONFIG_PATH="${{ env.defconfig_path }}"
          JOBS=$(nproc)
          THREADS=$((JOBS + 2))
          echo "Build jobs: ${THREADS} (CPU cores: ${JOBS})"

          # Cross-compiler detection
          CROSS64=""
          if command -v aarch64-linux-gnu-gcc &>/dev/null; then
            CROSS64="aarch64-linux-gnu-"
          elif [ -x "${HOME}/gcc-aarch64/bin/aarch64-linux-android-gcc" ]; then
            CROSS64="${HOME}/gcc-aarch64/bin/aarch64-linux-android-"
          fi
          echo "Cross-compiler: ${CROSS64:-system default}"

          CROSS32=""
          if command -v arm-linux-gnueabihf-gcc &>/dev/null; then
            CROSS32="arm-linux-gnueabihf-"
          fi
          echo "Cross-compiler 32-bit: ${CROSS32:-system default}"

          # ── Check for build.sh ──
          BUILD_SCRIPT=""
          for script in procsys.sh build.sh build_kernel.sh Makefile_build.sh; do
            if [ -f "${KR}/${script}" ] && [ -x "${KR}/${script}" ]; then
              BUILD_SCRIPT="${KR}/${script}"
              break
            fi
          done

          if [ -n "${BUILD_SCRIPT}" ]; then
            echo "Using build script: ${BUILD_SCRIPT}"
            # Build with script
            cd "${KR}"
            chmod +x "${BUILD_SCRIPT}"

            export CC="clang"
            export ARCH="arm64"
            export SUBARCH="arm64"

            if [[ "${{ env.CLEAN_BUILD }}" == "true" ]]; then
              echo "=== Clean build ==="
              make ARCH=arm64 mrproper 2>/dev/null || true
            fi

            bash "${BUILD_SCRIPT}"

          else
            echo "No build script found, using direct make"
            cd "${KR}"

            # Set compiler
            export CC="clang"
            export LD="ld.lld"
            export AR="llvm-ar"
            export NM="llvm-nm"
            export STRIP="llvm-strip"
            export OBJCOPY="llvm-objcopy"
            export OBJDUMP="llvm-objdump"
            export OBJSIZE="llvm-size"
            export READELF="llvm-readelf"
            export HOSTCC="clang"
            export HOSTCXX="clang++"
            export HOSTAR="llvm-ar"
            export HOSTLD="ld.lld"
            export ARCH="arm64"
            export SUBARCH="arm64"

            MAKE_FLAGS=(
              "ARCH=arm64"
              "CC=clang"
              "CROSS_COMPILE=${CROSS64}"
              "CROSS_COMPILE_COMPAT=${CROSS32}"
              "LD=ld.lld"
              "AR=llvm-ar"
              "NM=llvm-nm"
              "OBJCOPY=llvm-objcopy"
              "OBJDUMP=llvm-objdump"
              "STRIP=llvm-strip"
              "OBJSIZE=llvm-size"
              "READELF=llvm-readelf"
              "HOSTCC=clang"
              "HOSTCXX=clang++"
              "HOSTAR=llvm-ar"
              "HOSTLD=ld.lld"
              "CLANG_TRIPLE=aarch64-linux-gnu-"
              "KBUILD_BUILD_USER=${KBUILD_BUILD_USER}"
              "KBUILD_BUILD_HOST=${KBUILD_BUILD_HOST}"
            )

            if [[ "${{ env.CLEAN_BUILD }}" == "true" ]]; then
              echo "=== mrproper ==="
              make "${MAKE_FLAGS[@]}" mrproper
            fi

            echo ""
            echo "=== defconfig: ${DEFCONFIG_PATH} ==="
            make "${MAKE_FLAGS[@]}" "$(basename ${DEFCONFIG_PATH})"

            echo ""
            echo "=== Compiling kernel ==="
            echo "Start: $(date)"
            make "${MAKE_FLAGS[@]}" -j"${THREADS}" 2>&1 | \
              while IFS= read -r line; do
                case "${line}" in
                  *"error:"*|*"fatal:"*|*"Error "*)
                    echo "::error::${line}" ;;
                  *"warning:"*)
                    echo "::warning::${line}" 2>/dev/null ;;
                esac
                echo "${line}"
              done
            BUILD_RC=${PIPESTATUS[0]}

            if [ ${BUILD_RC} -ne 0 ]; then
              echo "::error::Build failed with exit code ${BUILD_RC}"

              echo ""
              echo "=== Build Error Diagnostics ==="
              echo "Last 50 lines of build log:"
              tail -50 /proc/self/fd/1 2>/dev/null || true
              echo ""
              echo "Searching for errors..."
              find . -name "*.o.err" -exec cat {} \; 2>/dev/null | head -20 || true
              exit 1
            fi
          fi

          echo ""
          echo "Build completed: $(date)"
          echo "Duration: $(( $(date +%s) - ${{ env.BUILD_START }} ))s"

      # ───────────────────────────────────────────────────
      #  8. Collect Build Artifacts
      # ───────────────────────────────────────────────────
      - name: '[8/10] Collect artifacts'
        id: collect
        run: |
          set -euo pipefail
          cd kernel_source
          KR="${{ env.KERNEL_ROOT }}"
          OUT_DIR="${KR}/out"

          # Create output directory
          OUTPUT="${HOME}/kernel_output"
          mkdir -p "${OUTPUT}"

          # ── Find kernel image ──
          echo "=== Searching for kernel image ==="
          KERNEL_IMG=""

          # Search in common output locations
          for img in \
            "arch/arm64/boot/Image.gz" \
            "arch/arm64/boot/Image.gz-dtb" \
            "arch/arm64/boot/Image" \
            "out/arch/arm64/boot/Image.gz" \
            "out/arch/arm64/boot/Image.gz-dtb" \
            "out/arch/arm64/boot/Image"; do
            if [ -f "${KR}/${img}" ]; then
              KERNEL_IMG="${KR}/${img}"
              echo "Found: ${img}"
              break
            fi
          done

          # Also check symlink
          if [ -z "${KERNEL_IMG}" ] && [ -L "${KR}/out" ]; then
            REAL_OUT=$(readlink -f "${KR}/out")
            for img in arch/arm64/boot/Image.gz arch/arm64/boot/Image.gz-dtb; do
              if [ -f "${REAL_OUT}/${img}" ]; then
                KERNEL_IMG="${REAL_OUT}/${img}"
                echo "Found: ${img} (via symlink)"
                break
              fi
            done
          fi

          if [ -z "${KERNEL_IMG}" ]; then
            echo "Searching entire tree..."
            KERNEL_IMG=$(find "${KR}" -path "*/arch/arm64/boot/Image.gz*" -type f 2>/dev/null | head -1)
          fi

          if [ -z "${KERNEL_IMG}" ] || [ ! -f "${KERNEL_IMG}" ]; then
            echo "::error::Kernel image not found"
            echo ""
            echo "Directory structure:"
            find "${KR}/arch/arm64/boot" -type f 2>/dev/null || true
            find "${KR}/out" -type f -name "Image*" 2>/dev/null || true
            exit 1
          fi

          cp "${KERNEL_IMG}" "${OUTPUT}/Image.gz"
          echo "Kernel: $(ls -lh "${OUTPUT}/Image.gz" | awk '{print $5}')"

          # ── Copy DTBs/DTBOs ──
          echo ""
          echo "=== Searching for DTBs/DTBOs ==="
          DTB_COUNT=0

          for dtb_dir in \
            "${KR}/out/arch/arm64/boot/dts" \
            "${KR}/arch/arm64/boot/dts" \
            "${KR}/out/arch/arm64/boot/dts/vendor"; do
            if [ -d "${dtb_dir}" ]; then
              find "${dtb_dir}" -name "*.dtb" -o -name "*.dtbo" | while read dtb; do
                cp "${dtb}" "${OUTPUT}/"
                DTB_COUNT=$((DTB_COUNT + 1))
              done
            fi
          done

          echo "DTBs found: $(find "${OUTPUT}" -name "*.dtb" -o -name "*.dtbo" | wc -l)"

          # ── Build Summary ──
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║           Build Artifacts                ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Kernel Image: $(basename "${KERNEL_IMG}")"
          echo "║  Size: $(ls -lh "${OUTPUT}/Image.gz" | awk '{print $5}')"
          echo "║  KSU Version: ${{ env.KSU_VERSION }}"
          echo "║  SUSFS Version: ${{ env.SUSFS_VERSION }}"
          echo "║  DTBs: $(find "${OUTPUT}" -name "*.dtb" | wc -l)"
          echo "║  DTBOs: $(find "${OUTPUT}" -name "*.dtbo" | wc -l)"
          echo "╚══════════════════════════════════════════╝"

          # Save build info
          cat > "${OUTPUT}/build_info.txt" << INFO
  Build Information
  ════════════════════════════════════════════════
  Device:         ${{ env.DEVICE }} (Motorola Moto G45 5G)
  SoC:            SM6375 (Snapdragon 6s Gen 3)
  Platform:       Holi
  Kernel:         ${{ env.kernel_version }}
  KernelSU-Next:  ${{ env.KSU_VERSION }}
  SUSFS:          ${{ env.SUSFS_VERSION }}
  Compiler:       Proton Clang ${{ env.CLANG_VERSION }}
  Build Date:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')
  Build Type:     ${{ env.BUILD_TYPE }}
  Clean Build:    ${{ env.CLEAN_BUILD }}
  Compatibility:  AyakaUI, LineageOS, AOSP, PixelOS
  ════════════════════════════════════════════════

  SUSFS Features:
    SUS_PATH:     Enabled (hide paths from detection)
    SUS_MOUNT:    Enabled (hide mounts)
    SUS_KSTAT:    Enabled (spoof file stats)
    SPOOF_UNAME:  Enabled (spoof kernel version)
    SPOOF_CMDLINE: Enabled (spoof /proc/cmdline)
    OPEN_REDIRECT: Enabled (redirect file opens)
    SUS_MAP:      Enabled (hide memory mappings)
    AVC_SPOOF:    Enabled (SELinux AVC spoof)
    TRY_UMOUNT:   Enabled (unmount before detection)
    ADD_SUS_SU:   Enabled (hidden su binary)
  INFO

          echo "build_info_generated=true" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────
      #  9. Package with AnyKernel3
      # ───────────────────────────────────────────────────
      - name: '[9/10] Package AnyKernel3'
        id: package
        run: |
          set -euo pipefail
          OUTPUT="${HOME}/kernel_output"

          echo "=== Packaging with AnyKernel3 ==="

          # Clone AnyKernel3
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            /tmp/anykernel3

          cd /tmp/anykernel3

          # Remove default files
          rm -rf .git modules patch ramdisk tools
          rm -f LICENSE README.md

          # Copy kernel artifacts
          cp "${OUTPUT}/Image.gz" /tmp/anykernel3/

          # Copy DTBs if present
          cp "${OUTPUT}"/*.dtb /tmp/anykernel3/ 2>/dev/null || true
          cp "${OUTPUT}"/*.dtbo /tmp/anykernel3/ 2>/dev/null || true

          # Detect image type
          if [ -f /tmp/anykernel3/Image.gz-dtb ]; then
            IMAGE_TYPE="Image.gz-dtb"
          elif [ -f /tmp/anykernel3/Image.gz ]; then
            IMAGE_TYPE="Image.gz"
          else
            IMAGE_TYPE="Image"
          fi
          echo "Image type: ${IMAGE_TYPE}"

          # ── Write anykernel.sh ──
          cat > /tmp/anykernel3/anykernel.sh << 'AK3'
  ##############################
  # AnyKernel3 Ramdisk Mod Script
  # osm0sis@xda-developers
  ##############################

  ## AnyKernel3 attributes
  properties() { '
  do.devicecheck=1
  do.modules=0
  do.systemless=1
  do.cleanup=1
  do.cleanuponabort=0
  device.name1=fogos
  device.name2=Motorola Moto G45 5G
  device.name3=moto g45 5g
  device.name4=moto g45
  '; }

  ## AnyKernel3 install
  block=auto;
  is_slot_device=1;
  ramdisk_compression=auto;
  patch_vtb=0;

  ## Import patching functions/variables
  . tools/ak3-core.sh;

  ## Install kernel
  AK3

          # Append image split config based on image type
          if [ "${IMAGE_TYPE}" = "Image.gz-dtb" ]; then
            cat >> /tmp/anykernel3/anykernel.sh << 'AK3'
  flash_boot;
  AK3
          else
            cat >> /tmp/anykernel3/anykernel.sh << 'AK3'
  split_boot;
  flash_boot;
  AK3
          fi

          # Set device check
          sed -i 's|^  device\.name1=.*|  device.name1=fogos;|' /tmp/anykernel3/anykernel.sh

          # Create flashable zip
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          KSU_VER_SAFE=$(echo "${{ env.KSU_VERSION }}" | tr '/' '-')
          SUSFS_VER_SAFE=$(echo "${{ env.SUSFS_VERSION }}" | tr '/' '-')
          ZIP_NAME="Kernel-fogos-KSU-${KSU_VER_SAFE}-SUSFS-${SUSFS_VER_SAFE}-${BUILD_DATE}.zip"

          zip -r9 "/tmp/${ZIP_NAME}" . -x '*.git*' -x 'README.md' -x 'LICENSE'

          # Copy to output
          cp "/tmp/${ZIP_NAME}" "${OUTPUT}/"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_ENV"

          echo ""
          echo "Flashable zip: ${ZIP_NAME}"
          echo "Size: $(ls -lh "${OUTPUT}/${ZIP_NAME}" | awk '{print $5}')"

          # Generate checksum
          cd "${OUTPUT}"
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          echo ""
          echo "SHA256: $(cat "${ZIP_NAME}.sha256")"

          # ── Verify package contents ──
          echo ""
          echo "=== Package contents ==="
          unzip -l "${OUTPUT}/${ZIP_NAME}" | head -30

      # ───────────────────────────────────────────────────
      #  10. Verify & Upload
      # ───────────────────────────────────────────────────
      - name: '[10/10] Verify & upload'
        id: verify
        run: |
          set -euo pipefail
          OUTPUT="${HOME}/kernel_output"

          echo "╔══════════════════════════════════════════╗"
          echo "║         Build Verification               ║"
          echo "╚══════════════════════════════════════════╝"

          # Verify zip exists
          ZIP_FILE="${OUTPUT}/${{ env.zip_name }}"
          if [ ! -f "${ZIP_FILE}" ]; then
            echo "::error::Flashable zip not found"
            exit 1
          fi

          ZIP_SIZE=$(stat -f%z "${ZIP_FILE}" 2>/dev/null || stat -c%s "${ZIP_FILE}")
          echo "Zip size: ${ZIP_SIZE} bytes"

          if [ "${ZIP_SIZE}" -lt 1000000 ]; then
            echo "::warning::Zip file suspiciously small (< 1MB)"
          fi

          # Verify zip is valid
          if ! unzip -t "${ZIP_FILE}" >/dev/null 2>&1; then
            echo "::error::Zip file is corrupted"
            exit 1
          fi
          echo "Zip integrity: OK"

          # Verify kernel image inside zip
          if unzip -l "${ZIP_FILE}" | grep -q "Image.gz"; then
            echo "Kernel image in zip: OK"
          else
            echo "::warning::Image.gz not found in zip"
          fi

          # Build info
          if [ -f "${OUTPUT}/build_info.txt" ]; then
            echo ""
            cat "${OUTPUT}/build_info.txt"
          fi

          # ── Final Summary ──
          BUILD_END=$(date +%s)
          DURATION=$((BUILD_END - ${{ env.BUILD_START }}))
          DURATION_MIN=$((DURATION / 60))
          DURATION_SEC=$((DURATION % 60))

          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║         Build Complete!                   ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║  Status: SUCCESS ✓                       ║"
          echo "║  Duration: ${DURATION_MIN}m ${DURATION_SEC}s"
          echo "║  Device: fogos (Moto G45 5G)             ║"
          echo "║  Kernel: ${{ env.kernel_version }}"
          echo "║  KSU: ${{ env.KSU_VERSION }}"
          echo "║  SUSFS: ${{ env.SUSFS_VERSION }}"
          echo "║  Package: ${{ env.zip_name }}"
          echo "╚══════════════════════════════════════════╝"

          # Set outputs
          echo "build_status=success" >> "$GITHUB_OUTPUT"
          echo "kernel_version=${{ env.kernel_version }}" >> "$GITHUB_OUTPUT"
          echo "ksu_version=${{ env.KSU_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "susfs_version=${{ env.SUSFS_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${{ env.zip_name }}" >> "$GITHUB_OUTPUT"
          echo "build_duration=${DURATION}" >> "$GITHUB_OUTPUT"

          # List all output files
          echo ""
          echo "=== All output files ==="
          ls -lah "${OUTPUT}/"

      # ───────────────────────────────────────────────────
      #  Upload Artifact
      # ───────────────────────────────────────────────────
      - name: 'Upload build artifact'
        if: steps.verify.outputs.build_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            Kernel-fogos-KSU-${{ env.KSU_VERSION }}-SUSFS-${{ env.SUSFS_VERSION }}-${{ github.run_number }}
          path: |
            ${{ env.HOME }}/kernel_output/*.zip
            ${{ env.HOME }}/kernel_output/*.sha256
            ${{ env.HOME }}/kernel_output/build_info.txt
          retention-days: 30

      # ───────────────────────────────────────────────────
      #  Create GitHub Release (on tag push)
      # ───────────────────────────────────────────────────
      - name: 'Create GitHub Release'
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.verify.outputs.build_status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: >-
            Kernel fogos ${{ steps.verify.outputs.ksu_version }} + SUSFS ${{ steps.verify.outputs.susfs_version }}
          body: |
            ## Kernel Build — Motorola Moto G45 5G (fogos)

            | Detail | Info |
            |---|---|
            | **Device** | Motorola Moto G45 5G (fogos) |
            | **SoC** | SM6375 (Snapdragon 6s Gen 3) |
            | **Kernel** | ${{ steps.verify.outputs.kernel_version }} |
            | **KernelSU-Next** | ${{ steps.verify.outputs.ksu_version }} |
            | **SUSFS** | ${{ steps.verify.outputs.susfs_version }} |
            | **Compiler** | Proton Clang ${{ env.CLANG_VERSION }} |
            | **Build Date** | ${{ github.event.head_commit.timestamp }} |

            ### Compatibility
            - AyakaUI (Android 16)
            - LineageOS
            - AOSP-based ROMs
            - PixelOS

            ### SUSFS Features
            SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME, SPOOF_CMDLINE, OPEN_REDIRECT, SUS_MAP, AVC_SPOOF, TRY_UMOUNT, ADD_SUS_SU

            ### Installation
            1. Boot into recovery (Volume Down + Power)
            2. Flash the zip
            3. Install KernelSU-Next Manager APK
            4. Reboot
          files: |
            ${{ env.HOME }}/kernel_output/${{ env.zip_name }}
            ${{ env.HOME }}/kernel_output/${{ env.zip_name }}.sha256
            ${{ env.HOME }}/kernel_output/build_info.txt
          draft: false
          prerelease: false

      # ───────────────────────────────────────────────────
      #  Failure Handling
      # ───────────────────────────────────────────────────
      - name: 'Build failure diagnostics'
        if: failure()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║         Build FAILED                     ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          echo "Step failures:"
          echo "  checkout:  ${{ steps.checkout.outcome }}"
          echo "  ksu:       ${{ steps.ksu.outcome }}"
          echo "  susfs:     ${{ steps.susfs.outcome }}"
          echo "  defconfig: ${{ steps.defconfig.outcome }}"
          echo "  build:     ${{ steps.build.outcome }}"
          echo "  collect:   ${{ steps.collect.outcome }}"
          echo "  package:   ${{ steps.package.outcome }}"
          echo ""
          echo "Troubleshooting:"
          echo "  1. Check build logs above for error messages"
          echo "  2. Verify defconfig path is correct"
          echo "  3. Verify SUSFS patches are compatible with kernel ${{ env.kernel_version }}"
          echo "  4. Try clean build with 'clean_build: true'"
          echo "  5. Check if toolchain version supports this kernel"

      - name: 'Cleanup'
        if: always()
        run: |
          ccache -s 2>/dev/null || true
          echo "Cleanup complete"
