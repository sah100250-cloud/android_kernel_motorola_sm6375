name: Build Kernel — Moto G45 5G (final resilient)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel repository (owner/repo) to build (public preferred).'
        required: false
        default: 'sah100250-cloud/android_kernel_motorola_sm6375'
        type: string
      kernel_branch:
        description: 'Branch or ref to build from'
        required: false
        default: 'main'
        type: string
      ksu_version:
        description: 'KernelSU-Next version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      susfs_version:
        description: 'SUSFS version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      clang_version:
        description: 'Proton Clang version (17/18/19)'
        required: false
        default: '18'
        type: choice
        options: ['17','18','19']
      clean_build:
        description: 'Force clean build (true/false)'
        required: false
        default: true
        type: boolean

env:
  DEVICE: fogos

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build & Package Kernel (final resilient)
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout workflow repo (safe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install APT dependencies (non-interactive)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev libncurses-dev libssl-dev lz4 make openssl \
            perl python3 python3-pip xz-utils ccache zip unzip \
            device-tree-compiler zstd libelf-dev libudev-dev \
            wget curl git

      - name: Prepare env & inputs
        run: |
          set -euo pipefail
          WORKDIR="${GITHUB_WORKSPACE}/build"
          OUTPUT="${GITHUB_WORKSPACE}/build/output"
          mkdir -p "$WORKDIR" "$OUTPUT"
          echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          echo "KERNEL_REPO=${{ github.event.inputs.kernel_repo }}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${{ github.event.inputs.kernel_branch }}" >> $GITHUB_ENV
          echo "KSU_VERSION=${{ github.event.inputs.ksu_version }}" >> $GITHUB_ENV
          echo "SUSFS_VERSION=${{ github.event.inputs.susfs_version }}" >> $GITHUB_ENV
          echo "CLANG_VERSION=${{ github.event.inputs.clang_version }}" >> $GITHUB_ENV
          echo "CLEAN_BUILD=${{ github.event.inputs.clean_build }}" >> $GITHUB_ENV
          echo "DEVICE=${{ env.DEVICE }}" >> $GITHUB_ENV

      - name: Fetch kernel source (resilient: tarball -> clone -> fallback)
        run: |
          set -euo pipefail
          WORKDIR="${WORKDIR}"
          cd "$WORKDIR"
          rm -rf kernel_source || true

          REPO_INPUT="${KERNEL_REPO}"
          BRANCH="${KERNEL_BRANCH}"
          # normalize if input empty
          if [ -z "$REPO_INPUT" ] || [ "$REPO_INPUT" = "null" ]; then
            REPO_INPUT="${GITHUB_REPOSITORY}"
          fi

          owner=$(echo "$REPO_INPUT" | cut -d'/' -f1)
          repo=$(echo "$REPO_INPUT" | cut -d'/' -f2)
          success=0

          try_urls=(
            "https://github.com/${owner}/${repo}/archive/refs/heads/${BRANCH}.tar.gz"
            "https://github.com/${owner}/${repo}/archive/${BRANCH}.tar.gz"
            "https://github.com/${owner}/${repo}/tarball/${BRANCH}"
            "https://codeload.github.com/${owner}/${repo}/tar.gz/${BRANCH}"
          )

          for url in "${try_urls[@]}"; do
            echo "Trying download: $url"
            if wget -q --spider "$url" 2>/dev/null; then
              echo "Downloading $url ..."
              wget -q -O /tmp/kernel.tar.gz "$url"
              mkdir -p kernel_source
              tar -xzf /tmp/kernel.tar.gz -C kernel_source --strip-components=1 || true
              rm -f /tmp/kernel.tar.gz
              if [ -d kernel_source ] && [ "$(ls -A kernel_source || true)" ]; then
                echo "Extracted kernel source from $url"
                success=1
                break
              fi
            else
              echo "URL not reachable: $url"
            fi
          done

          if [ $success -eq 0 ]; then
            echo "Tarball downloads failed; attempting non-interactive git clone (public repos only)"
            # Prevent interactive credential prompt
            export GIT_TERMINAL_PROMPT=0
            if git clone --depth=1 --branch "$BRANCH" "https://github.com/${owner}/${repo}.git" kernel_source 2>/tmp/clone.err; then
              echo "git clone succeeded."
              success=1
            else
              echo "git clone failed (see /tmp/clone.err):"
              sed -n '1,200p' /tmp/clone.err || true
            fi
          fi

          if [ $success -eq 0 ]; then
            echo "All attempts to fetch ${REPO_INPUT}@${BRANCH} failed."
            echo "Falling back to repository where this workflow lives (current repo) as kernel_source."
            # copy workflow repo contents as fallback
            mkdir -p kernel_source
            cp -r "${GITHUB_WORKSPACE}/." kernel_source || true
            success=1
          fi

          if [ $success -ne 1 ]; then
            echo "::error::Failed to obtain kernel source"
            exit 1
          fi

          echo "Kernel source prepared at: $WORKDIR/kernel_source"
          ls -la kernel_source | head -n20

      - name: Download Proton Clang (best-effort)
        run: |
          set -euo pipefail
          CLANG_VERSION="${CLANG_VERSION:-18}"
          CLANG_DIR="${HOME}/proton-clang-${CLANG_VERSION}"
          mkdir -p "$CLANG_DIR"
          PRIMARY="https://github.com/nicofork/proton-clang/releases/download/clang-${CLANG_VERSION}/proton-clang-${CLANG_VERSION}.tar.zst"
          BACKUP="https://gitlab.com/nicofork/proton-clang/-/archive/clang-${CLANG_VERSION}/proton-clang-clang-${CLANG_VERSION}.tar.gz"
          if wget -q --show-progress "$PRIMARY" -O /tmp/clang.tar.zst 2>/dev/null; then
            if command -v zstd >/dev/null 2>&1; then
              zstd -d /tmp/clang.tar.zst --stdout | tar xf - -C "$CLANG_DIR" --strip-components=1 || true
            else
              tar xf /tmp/clang.tar.zst -C "$CLANG_DIR" --strip-components=1 2>/dev/null || true
            fi
            rm -f /tmp/clang.tar.zst
            export PATH="$CLANG_DIR/bin:$PATH"
            echo "Proton Clang installed to $CLANG_DIR"
          else
            echo "Proton Clang unavailable; will fallback to system cross compilers"
          fi

      - name: Integrate KernelSU-Next (best-effort)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source" || exit 1
          TMPKSU="/tmp/ksu_next_src"
          rm -rf "$TMPKSU" || true
          if [ "${KSU_VERSION:-latest}" = "latest" ]; then
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git "$TMPKSU" || true
          else
            git clone --depth=1 -b "${KSU_VERSION}" https://github.com/KernelSU-Next/KernelSU-Next.git "$TMPKSU" || true
          fi
          if [ -d "$TMPKSU/kernel" ]; then
            cp -r "$TMPKSU/kernel" ./KernelSU || true
            echo "KernelSU files copied"
          else
            echo "KernelSU kernel dir not present; will enable CONFIG_KSU via defconfig"
          fi
          rm -rf "$TMPKSU" || true

      - name: Apply SUSFS (best-effort)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source" || exit 1
          TMPSUS="/tmp/susfs_src"
          rm -rf "$TMPSUS" || true
          if [ "${SUSFS_VERSION:-latest}" = "latest" ]; then
            git clone --depth=1 https://github.com/sidex15/susfs4ksu-module.git "$TMPSUS" || true
          else
            git clone --depth=1 -b "${SUSFS_VERSION}" https://github.com/sidex15/susfs4ksu-module.git "$TMPSUS" || true
          fi
          if [ -d "$TMPSUS/kernel" ]; then
            cp -rv "$TMPSUS/kernel/"* . 2>/dev/null || true
            echo "SUSFS kernel patches copied"
          fi
          if [ -d "$TMPSUS/susfs" ]; then
            cp -rv "$TMPSUS/susfs" ./susfs 2>/dev/null || true
            echo "SUSFS module copied"
          fi
          rm -rf "$TMPSUS" || true

      - name: Patch defconfig (safe injection for 5.4)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source" || exit 1
          if [ -d "kernel_src" ]; then KR="kernel_src"; else KR="."; fi
          cd "$KR" || exit 1
          DEVICE="${DEVICE:-fogos}"
          DEF=""
          for c in \
            "arch/arm64/configs/vendor/${DEVICE}_defconfig" \
            "arch/arm64/configs/vendor/${DEVICE}" \
            "arch/arm64/configs/vendor/sm6375_${DEVICE}_defconfig" \
            "arch/arm64/configs/${DEVICE}_defconfig"; do
            if [ -f "$c" ]; then DEF="$c"; break; fi
          done
          if [ -z "$DEF" ]; then
            DEF=$(find arch/arm64/configs -type f -iname "*${DEVICE}*" -o -iname "*sm6375*" -o -iname "*defconfig*" 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$DEF" ]; then
            echo "::warning::Defconfig not found; continuing but build may fail"
          else
            echo "Using defconfig: $DEF"
            cp "$DEF" "${DEF}.bak" || true
            printf '\n%s\n' "# Injected: KSU/SUSFS (CI)" \
              "CONFIG_KSU=y" \
              "CONFIG_KPROBES=y" \
              "CONFIG_HAVE_KPROBES=y" \
              "CONFIG_UPROBES=y" \
              "CONFIG_KSU_SUSFS=y" \
              "CONFIG_KSU_SUSFS_SUS_PATH=y" \
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
              "CONFIG_MODULES=y" \
              "CONFIG_EXT4_FS=y" \
              >> "$DEF"
            awk '!seen[$0]++ || /^#/' "$DEF" > /tmp/def.dedup || true
            mv /tmp/def.dedup "$DEF" || true
            echo "Defconfig patched (backup: ${DEF}.bak)"
          fi

      - name: Build kernel (attempt)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source" || exit 1
          if [ -d "kernel_src" ]; then cd kernel_src; fi
          export ARCH=arm64
          export SUBARCH=arm64
          # prefer clang
          if command -v clang >/dev/null 2>&1; then
            export CC=clang
            echo "Using clang"
          else
            if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
              export CROSS_COMPILE=aarch64-linux-gnu-
              echo "Using aarch64-linux-gnu-"
            else
              echo "::error::No suitable compiler found (clang or aarch64-linux-gnu-gcc)"
              exit 1
            fi
          fi
          # find defconfig for build
          DEF_FILE=$(find arch/arm64/configs -type f \( -iname "*${DEVICE}*" -o -iname "*sm6375*" -o -iname "*defconfig*" \) 2>/dev/null | head -n1 || true)
          if [ -z "$DEF_FILE" ]; then
            echo "::warning::Defconfig not found; attempting to build with default Makefile"
            # If there's a build script, try to invoke it
            if [ -f Makefile ]; then
              echo "No defconfig; attempting 'make' directly (may fail)"
            else
              echo "::error::No Makefile/defconfig available"
              exit 1
            fi
          else
            DEFBASE=$(basename "$DEF_FILE")
            echo "Using defconfig: $DEFBASE"
            if [ "${CLEAN_BUILD}" = "true" ] || [ "${CLEAN_BUILD}" = "True" ]; then
              make ARCH=arm64 mrproper || true
            fi
            make ARCH=arm64 "$DEFBASE"
          fi
          # compile
          make ARCH=arm64 -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          # always keep build.log for debugging
          if [ $rc -ne 0 ]; then
            echo "::error::Build failed with exit $rc; upload build.log artifact"
            exit $rc
          fi
          echo "Build completed successfully."

      - name: Upload build log (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            ${WORKDIR}/kernel_source/**/build.log
            ${WORKDIR}/build/logs/*.log

      - name: Package artifacts (AnyKernel minimal) 
        if: success()
        run: |
          set -euo pipefail
          cd "${WORKDIR}/kernel_source" || exit 1
          if [ -d "kernel_src" ]; then cd kernel_src; fi
          OUT="${OUTPUT}"
          mkdir -p "$OUT"
          IMG=$(find . -path "*/arch/arm64/boot/Image*" -type f 2>/dev/null | head -n1 || true)
          if [ -z "$IMG" ]; then
            echo "::error::Kernel image not found; skipping packaging"
            exit 1
          fi
          cp "$IMG" "$OUT/Image.gz" || cp "$IMG" "$OUT/Image" || true
          find . -path "*/arch/arm64/boot/dts*" -name "*.dtb" -o -name "*.dtbo" -print0 | xargs -0 -I{} cp {} "$OUT/" || true
          AK="/tmp/anykernel"
          rm -rf "$AK"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK" || true
          cp "$OUT"/Image* "$AK/" 2>/dev/null || true
          cp "$OUT"/*.dtb "$AK/" 2>/dev/null || true
          cd "$AK" || true
          printf '%s\n' "##############################" "# AnyKernel3 minimal" "##############################" > anykernel.sh
          printf '%s\n' ". tools/ak3-core.sh || true" >> anykernel.sh
          ZIP="kernel-${DEVICE}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "/tmp/$ZIP" . -x '*.git*' -x 'README.md' -x 'LICENSE' || true
          mv "/tmp/$ZIP" "$OUT/" || true
          sha256sum "$OUT/$ZIP" > "$OUT/$ZIP.sha256" || true
          echo "Packaged: $OUT/$ZIP"

      - name: Upload kernel zip artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: build/output/*.zip
