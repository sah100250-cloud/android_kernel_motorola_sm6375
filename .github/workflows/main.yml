# Build Kernel — Moto G45 5G (fogos) — KernelSU-Next + SUSFS helper
name: Build Kernel — Moto G45 5G (fogos)

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU-Next version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      susfs_version:
        description: 'SUSFS version (tag or "latest")'
        required: false
        default: 'latest'
        type: string
      clang_version:
        description: 'Proton Clang version'
        required: false
        default: '18'
        type: choice
        options:
          - '17'
          - '18'
          - '19'
      clean_build:
        description: 'Force clean build'
        required: false
        default: true
        type: boolean

env:
  # Adjust these as needed
  KERNEL_REPO: 'AnandSuresh02/android_kernel_motorola_sm6375'
  KERNEL_BRANCH: 'main'
  DEVICE: 'fogos'
  TZ: 'Asia/Jakarta'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build and Package Kernel (${{ env.DEVICE }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KSU_VERSION: ${{ github.event.inputs.ksu_version }}
      SUSFS_VERSION: ${{ github.event.inputs.susfs_version }}
      CLANG_VERSION: ${{ github.event.inputs.clang_version }}
      CLEAN_BUILD: ${{ github.event.inputs.clean_build }}
      KERNEL_REPO: ${{ env.KERNEL_REPO }}
      KERNEL_BRANCH: ${{ env.KERNEL_BRANCH }}
      DEVICE: ${{ env.DEVICE }}

    steps:
      - name: Checkout runner workspace (empty)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install basic packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            bc bison flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev libssl-dev lz4 libncurses5 make openssl \
            perl python3 python3-pip xz-utils ccache zip unzip \
            device-tree-compiler zstd libelf-dev libudev-dev \
            wget curl jq pkg-config

      - name: Prepare build directories
        run: |
          set -euo pipefail
          mkdir -p $HOME/kernel_build
          mkdir -p $HOME/kernel_output
          echo "WORKDIR=$HOME/kernel_build" >> $GITHUB_ENV
          echo "OUTPUTDIR=$HOME/kernel_output" >> $GITHUB_ENV

      - name: Download & install Proton Clang
        run: |
          set -euo pipefail
          CLANG_DIR="${HOME}/proton-clang-${CLANG_VERSION}"
          echo "CLANG_DIR=${CLANG_DIR}"
          mkdir -p "${CLANG_DIR}"
          PRIMARY="https://github.com/nicofork/proton-clang/releases/download/clang-${CLANG_VERSION}/proton-clang-${CLANG_VERSION}.tar.zst"
          BACKUP="https://gitlab.com/nicofork/proton-clang/-/archive/clang-${CLANG_VERSION}/proton-clang-clang-${CLANG_VERSION}.tar.gz"
          if wget -q --show-progress "${PRIMARY}" -O /tmp/clang.tar.zst 2>/dev/null; then
            zstd -d /tmp/clang.tar.zst --stdout | tar xf - -C "${CLANG_DIR}" --strip-components=1
            rm -f /tmp/clang.tar.zst
          else
            echo "Primary clang download failed, trying backup"
            wget -q "${BACKUP}" -O /tmp/clang.tar.gz
            tar xf /tmp/clang.tar.gz -C "${CLANG_DIR}" --strip-components=1 || true
            rm -f /tmp/clang.tar.gz
          fi
          export PATH="${CLANG_DIR}/bin:${PATH}"
          if ! command -v clang >/dev/null 2>&1; then
            echo "::error::clang not available after download"
            exit 1
          fi
          clang --version | head -n 1

      - name: Clone kernel source
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          echo "Cloning https://github.com/${KERNEL_REPO}.git (branch ${KERNEL_BRANCH})"
          git clone --depth=1 -b "${KERNEL_BRANCH}" "https://github.com/${KERNEL_REPO}.git" kernel_source
          cd kernel_source
          # detect kernel root
          if [ -d "kernel_src" ]; then
            KERNEL_ROOT="kernel_src"
          elif [ -f "Makefile" ] && grep -q "^VERSION" Makefile 2>/dev/null; then
            KERNEL_ROOT="."
          else
            KERNEL_ROOT="."
          fi
          echo "KERNEL_ROOT=${KERNEL_ROOT}" >> $GITHUB_ENV
          # kernel version
          KVERSION=$(grep -m1 "^VERSION" Makefile | awk '{print $3}' || true)
          KPATCHLEVEL=$(grep -m1 "^PATCHLEVEL" Makefile | awk '{print $3}' || true)
          KSUBLEVEL=$(grep -m1 "^SUBLEVEL" Makefile | awk '{print $3}' || true)
          echo "KERNEL_VERSION=${KVERSION:-0}.${KPATCHLEVEL:-0}.${KSUBLEVEL:-0}" >> $GITHUB_ENV

      - name: Integrate KernelSU-Next (best-effort)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source"
          KSU="${KSU_VERSION:-latest}"
          TMP="/tmp/ksu-next"
          rm -rf "$TMP"; mkdir -p "$TMP"
          if [ "$KSU" = "latest" ]; then
            git clone --depth=1 "https://github.com/KernelSU-Next/KernelSU-Next.git" "$TMP" || true
          else
            git clone --depth=1 -b "$KSU" "https://github.com/KernelSU-Next/KernelSU-Next.git" "$TMP" || true
          fi
          # copy kernel integration if present
          if [ -d "$TMP/kernel" ]; then
            cp -r "$TMP/kernel" "${KERNEL_ROOT}/KernelSU" || true
            echo "Copied KernelSU kernel files"
          else
            echo "No kernel/ dir in KernelSU-Next release — proceeding (defconfig fallback will enable CONFIG_KSU)"
          fi
          rm -rf "$TMP"

      - name: Apply SUSFS (best-effort)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source"
          SVER="${SUSFS_VERSION:-latest}"
          TMP="/tmp/susfs-src"
          rm -rf "$TMP"; mkdir -p "$TMP"
          if [ "$SVER" = "latest" ]; then
            git clone --depth=1 "https://github.com/sidex15/susfs4ksu-module.git" "$TMP" || true
          else
            git clone --depth=1 -b "$SVER" "https://github.com/sidex15/susfs4ksu-module.git" "$TMP" || true
          fi
          if [ -d "$TMP/kernel" ]; then
            cp -rv "$TMP/kernel/"* "${KERNEL_ROOT}/" 2>/dev/null || true
            echo "Copied SUSFS kernel files"
          fi
          if [ -d "$TMP/susfs" ]; then
            cp -rv "$TMP/susfs" "${KERNEL_ROOT}/susfs" 2>/dev/null || true
            echo "Copied SUSFS module files"
          fi
          rm -rf "$TMP"

      - name: Configure defconfig (inject KSU + SUSFS flags)
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source"
          KR="${KERNEL_ROOT}"
          DEVICE="${DEVICE}"
          # find candidate defconfig
          DEF=""
          for f in \
            "arch/arm64/configs/vendor/${DEVICE}_defconfig" \
            "arch/arm64/configs/vendor/${DEVICE}" \
            "arch/arm64/configs/vendor/sm6375_${DEVICE}_defconfig" \
            "arch/arm64/configs/vendor/sm6375_defconfig" \
            "arch/arm64/configs/${DEVICE}_defconfig" \
            "arch/arm64/configs/vendor/qcom/${DEVICE}_defconfig" ; do
            if [ -f "$f" ]; then
              DEF="$f"; break
            fi
          done
          if [ -z "$DEF" ]; then
            DEF=$(find arch/arm64/configs -type f \( -iname "*${DEVICE}*" -o -iname "*fogos*" -o -iname "*sm6375*" \) 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$DEF" ]; then
            echo "No defconfig found under arch/arm64/configs — aborting"
            exit 1
          fi
          echo "Using defconfig: $DEF"
          cp "$DEF" "${DEF}.bak" || true
          # append KSU/SUSFS config block (dedupe later)
          cat >> "$DEF" <<'KSU_SUSFS_END'

# KernelSU-Next + SUSFS injected (by CI)
CONFIG_KSU=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBES_ON_FTRACE=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_UPROBE_EVENTS=y

CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNTS=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNTS=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG=y
CONFIG_KSU_SUSFS_ADD_SUS_SU=y
CONFIG_KSU_SUSFS_AVC_SPOOF=y

CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODULE_FORCE_UNLOAD=y
CONFIG_MODULE_SIG=y

CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_EXT4_USE_FOR_EXT2=y

KSU_SUSFS_END
          # remove duplicate lines (keep first occurrence)
          awk '!seen[$0]++ || /^#/' "$DEF" > /tmp/defcfg.tmp || true
          mv /tmp/defcfg.tmp "$DEF" || true
          echo "Defconfig patched."

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source"
          KR="${KERNEL_ROOT}"
          export PATH="${HOME}/proton-clang-${CLANG_VERSION}/bin:${PATH}"
          export CC=clang
          export ARCH=arm64
          export SUBARCH=arm64
          # choose cross compilers if present
          CROSS64=""
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then CROSS64="aarch64-linux-gnu-"; fi
          JOBS=$(nproc || echo 2)
          THREADS=$((JOBS + 2))
          # determine defconfig basename if not set
          if [ -z "${DEF}" ]; then
            DEF=$(find arch/arm64/configs -type f \( -iname "*${DEVICE}*" -o -iname "*fogos*" -o -iname "*sm6375*" \) 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$DEF" ]; then
            echo "::error::Cannot find defconfig to build"
            exit 1
          fi
          DEF_BASENAME=$(basename "$DEF")
          echo "Using defconfig: $DEF_BASENAME"
          if [ "${CLEAN_BUILD}" = "true" ] || [ "${CLEAN_BUILD}" = "True" ]; then
            make mrproper || true
          fi
          make ARCH=arm64 CROSS_COMPILE=${CROSS64} "$DEF_BASENAME"
          # compile and capture log
          make ARCH=arm64 CROSS_COMPILE=${CROSS64} -j"${THREADS}" 2>&1 | tee build.log
          EXITCODE=${PIPESTATUS[0]}
          if [ "${EXITCODE}" -ne 0 ]; then
            echo "::error::Build failed (exit ${EXITCODE}) - output last 100 lines:"
            tail -n 100 build.log || true
            exit ${EXITCODE}
          fi
          echo "Build succeeded"

      - name: Collect artifacts and package AnyKernel3
        run: |
          set -euo pipefail
          cd "$WORKDIR/kernel_source"
          KR="${KERNEL_ROOT}"
          OUTPUT="$OUTPUTDIR"
          mkdir -p "$OUTPUT"
          # find image
          IMG=$(find "${KR}" -path "*/arch/arm64/boot/Image*" -type f 2>/dev/null | head -n1 || true)
          if [ -z "$IMG" ]; then
            echo "::error::Kernel image not found"
            exit 1
          fi
          cp "$IMG" "$OUTPUT/Image.gz" || cp "$IMG" "$OUTPUT/Image" || true
          # copy dtbs
          find "${KR}" -path "*/arch/arm64/boot/dts*" -name "*.dtb" -o -name "*.dtbo" -print0 | xargs -0 -I{} cp {} "$OUTPUT/" || true
          echo "Artifacts copied to $OUTPUT"
          # package with AnyKernel3
          AK="/tmp/anykernel3"
          rm -rf "$AK"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK" || true
          cd "$AK" || exit 1
          rm -rf .git modules patch ramdisk tools || true
          cp "$OUTPUT"/Image* "$AK/" 2>/dev/null || true
          cp "$OUTPUT"/*.dtb "$AK/" 2>/dev/null || true
          # minimal anykernel.sh adjustments
          cat > "$AK/anykernel.sh" <<'AKSH'
##############################
# AnyKernel3 minimal
##############################
properties() { '
do.devicecheck=1
do.systemless=1
do.cleanup=1
device.name1=fogos
'; }
. tools/ak3-core.sh || true
AKSH
          cd "$AK" || exit 1
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          KSU_SAFE=$(echo "${KSU_VERSION}" | tr '/' '-')
          SUSFS_SAFE=$(echo "${SUSFS_VERSION}" | tr '/' '-')
          ZIPNAME="Kernel-${DEVICE}-KSU-${KSU_SAFE}-SUSFS-${SUSFS_SAFE}-${BUILD_DATE}.zip"
          zip -r9 "/tmp/${ZIPNAME}" . -x '*.git*' -x 'README.md' -x 'LICENSE' || true
          mv "/tmp/${ZIPNAME}" "$OUTPUT/" || true
          sha256sum "$OUTPUT/${ZIPNAME}" > "$OUTPUT/${ZIPNAME}.sha256" || true
          echo "Packaged: $OUTPUT/${ZIPNAME}"
          echo "ZIP=${OUTPUT}/${ZIPNAME}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ${{ env.OUTPUTDIR }}/*.zip

      - name: Done — summary
        run: |
          set -euo pipefail
          echo "Build finished. Artifacts in $OUTPUTDIR"
          ls -lh "$OUTPUTDIR" || true
