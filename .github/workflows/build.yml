name: Kernel fogos | SukiSU Ultra + SUSFS (non-GKI)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl wget python3 bc bison \
            build-essential ccache flex \
            libssl-dev libncurses5-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip unzip cpio kmod pahole

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git \
            -b sixteen \
            kernel_src
          echo "=== Kernel version ==="
          head -5 kernel_src/Makefile
          echo "=== Available vendor configs ==="
          ls kernel_src/arch/arm64/configs/vendor/
          echo "=== Available ext_configs ==="
          ls kernel_src/arch/arm64/configs/vendor/ext_config/ \
            2>/dev/null || echo "no ext_config dir"

      - name: Download Clang toolchain
        run: |
          mkdir clang
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "Clang: $(clang/bin/clang --version | head -1)"

      # ---- PERUBAHAN UTAMA: SukiSU Ultra, bukan KernelSU-Next ----
      # susfs-main = branch yang sudah include SUSFS built-in,
      # tidak perlu manual patch .patch file (sumber masalah build sebelumnya)
      - name: Setup SukiSU Ultra (susfs-main, non-GKI)
        run: |
          cd kernel_src
          echo ">>> Integrating SukiSU Ultra with built-in SUSFS..."
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main
          echo "=== SukiSU version ==="
          cat KernelSU/kernel/Makefile | grep -i "VERSION\|PATCHLEVEL\|SUBLEVEL" | head -5

      - name: Validate hook integration (fast-fail, biar gak nunggu 1 jam kalau gagal)
        run: |
          cd kernel_src
          echo ">>> Cek apakah hook benar-benar tersisip ke source kernel..."
          HOOK_FOUND=$(grep -rl "ksu_handle_\|ksu_kprobe\|KSU_HOOK" \
            fs/exec.c fs/open.c fs/read_write.c fs/stat.c \
            security/security.c drivers/input/input.c \
            2>/dev/null | wc -l)
          echo "File dengan hook terdeteksi: $HOOK_FOUND"
          if [ "$HOOK_FOUND" -eq 0 ]; then
            echo "::warning::Tidak ada jejak hook KSU di source umum (fs/exec.c dkk)."
            echo "::warning::Build kemungkinan akan gagal di 'drivers/kernelsu' dengan error 'No hooks were defined'."
            echo "::warning::Ini tanda susfs-main branch SukiSU TIDAK auto-patch hook untuk kernel custom ini."
            echo "::warning::Lanjut build untuk lihat error pasti, tapi siapkan rencana B (lihat penjelasan chat)."
          else
            echo "OK - hook terdeteksi tersisip di source."
          fi

      - name: Generate defconfig for fogos
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          MAKE_ARGS="O=../out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"

          echo ">>> Step 1: Base holi-qgki defconfig"
          make $MAKE_ARGS vendor/holi-qgki_defconfig

          echo ">>> Step 2: Merge fogos ext configs"
          for cfg in \
            arch/arm64/configs/vendor/ext_config/moto-holi.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config; do
            if [ -f "$cfg" ]; then
              echo "  Merging: $cfg"
              ./scripts/kconfig/merge_config.sh \
                -m -O ../out ../out/.config "$cfg"
            else
              echo "  Warning: $cfg not found, skipping"
            fi
          done

          echo ">>> Step 3: Enable KSU/SukiSU + SUSFS + KPM (non-GKI requirements)"
          ./scripts/config --file ../out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -d KSU_WITH_KPROBES \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -d KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -d KSU_SUSFS_SUS_SU \
            -e KPM \
            -e KALLSYMS \
            -e KALLSYMS_ALL

          echo ">>> Step 4: Disable LTO to prevent interactive prompt (terbukti perlu dari log kamu)"
          ./scripts/config --file ../out/.config \
            -d LTO_CLANG \
            -e LTO_NONE \
            -d RELR 2>/dev/null || true

          echo ">>> Step 5: olddefconfig (auto-jawab semua prompt)"
          yes "" | make $MAKE_ARGS olddefconfig

          echo "=== Verifikasi config ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPM" \
            ../out/.config || echo "WARNING: config tidak ditemukan!"
          grep "CONFIG_LTO" ../out/.config || true

      - name: Build kernel
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          echo ">>> Building with $(nproc) threads..."
          # Tidak ada dtbo.img di build system SM6375 ini -- sudah dikonfirmasi
          # dari log build sebelumnya, jadi hanya build Image.gz
          yes "" | make -j$(nproc) \
            O=../out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz 2>&1 | tee ../build.log

          if [ -f ../out/arch/arm64/boot/Image.gz ]; then
            echo "BUILD SUCCESS"
            ls -lh ../out/arch/arm64/boot/
          else
            echo "BUILD FAILED - Last 100 lines:"
            tail -100 ../build.log
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git ak3

          cp out/arch/arm64/boot/Image.gz ak3/

          cat > ak3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=SukiSU Ultra + SUSFS | fogos | AyakaUI & others
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fogos
          device.name2=XT2363-2
          device.name3=XT2363-3
          device.name4=XT2363-5
          device.name5=XT2349-1
          device.name6=moto g45 5G
          device.name7=moto g34 5G
          '; }
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          . tools/ak3-core.sh
          . tools/repacktools.sh
          . tools/repack.sh
          EOF

          DATE=$(date +%Y%m%d-%H%M)
          ZIP="kernel-fogos-sukisu-susfs-${DATE}.zip"
          cd ak3
          zip -r9 "../${ZIP}" . -x ".git/*" "README.md"
          cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          ls -lh "${ZIP}"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fogos-sukisu-susfs-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7
