name: Kernel fogos | RKSU + SUSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl wget python3 bc bison \
            build-essential ccache flex \
            libssl-dev libncurses5-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip unzip cpio kmod pahole

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git \
            -b sixteen \
            kernel_src
          echo "=== Kernel version ==="
          head -5 kernel_src/Makefile

      - name: Download Clang toolchain
        run: |
          mkdir clang
          wget -q \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250101-release/Clang-20.0.0git-20250101.tar.gz \
            -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          echo "Clang: $(clang/bin/clang --version | head -1)"

      # ============================================================
      # Setup RKSU dengan release tag (bukan main) untuk Non-GKI
      # ============================================================
      - name: Setup RKSU (rsuntk/KernelSU - non-GKI)
        run: |
          cd kernel_src
          KSU_VERSION="v0.9.5"
          curl -LSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/${KSU_VERSION}/kernel/setup.sh" \
            | bash -s ${KSU_VERSION}
          echo "=== RKSU version ==="
          grep "^VERSION\|^PATCHLEVEL" KernelSU/kernel/Makefile | head -3

      # ============================================================
      # Fix untuk Non-GKI (WAJIB)
      # ============================================================
      - name: Fix KernelSU for Non-GKI compatibility
        run: |
          cd kernel_src/KernelSU
          # Revert commit yang menyebabkan SUSFS tidak bisa di-patch di Non-GKI
          git revert 898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899 --no-edit || true
          # Nonaktifkan KPROBES (SUS_SU tidak didukung)
          find . -name "*.c" -o -name "*.h" | xargs sed -i \
            's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g'
          # Pastikan manual hook aktif
          sed -i 's/^#ifndef CONFIG_KSU_MANUAL_HOOK/#if 1/g' kernel/ksu.c || true

      - name: Fix kernel 5.4 compatibility issues
        run: |
          cd kernel_src

          echo ">>> Fix 1: linux/pgtable.h tidak ada di kernel 5.4"
          find drivers/kernelsu -name "*.c" -o -name "*.h" 2>/dev/null | \
            xargs grep -l "linux/pgtable.h" 2>/dev/null | while read f; do
              sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
              echo "  Fixed pgtable.h: $f"
            done

          echo ">>> Fix 2: sulog.h missing linux/init.h"
          SULOG="drivers/kernelsu/feature/sulog.h"
          if [ -f "$SULOG" ]; then
            if ! grep -q "linux/init.h" "$SULOG"; then
              sed -i '1s/^/#include <linux\/init.h>\n/' "$SULOG"
              echo "  Fixed sulog.h: added linux/init.h"
            else
              echo "  sulog.h: already has init.h"
            fi
          fi

          echo ">>> Fix 3: Create linux/pgtable.h compat wrapper (fallback)"
          mkdir -p include/linux
          if [ ! -f "include/linux/pgtable.h" ]; then
            printf '/* Compatibility wrapper for kernel < 5.8 */\n#ifndef _LINUX_PGTABLE_COMPAT_H\n#define _LINUX_PGTABLE_COMPAT_H\n#include <asm/pgtable.h>\n#endif\n' \
              > include/linux/pgtable.h
            echo "  Created include/linux/pgtable.h compat wrapper"
          fi

          echo ">>> Verifikasi fixes..."
          grep -r "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null \
            && echo "WARNING: masih ada pgtable.h" \
            || echo "pgtable.h OK"

      # ============================================================
      # Apply SUSFS patch dengan urutan yang benar
      # ============================================================
      - name: Apply SUSFS patch for kernel 5.4
        run: |
          wget -q \
            https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_5.4.patch \
            -O susfs_patch.patch

          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b kernel-5.4 susfs_src

          cd kernel_src

          cp ../susfs_src/kernel_patches/fs/susfs.c \
            fs/ 2>/dev/null || true
          cp ../susfs_src/kernel_patches/include/linux/susfs.h \
            include/linux/ 2>/dev/null || true
          cp ../susfs_src/kernel_patches/include/linux/susfs_def.h \
            include/linux/ 2>/dev/null || true
          cp ../susfs_src/kernel_patches/include/linux/sus_su.h \
            include/linux/ 2>/dev/null || true

          # Patch KSU Kconfig agar muncul opsi KSU_SUSFS
          cp ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 --fuzz=3 < 10_enable_susfs_for_ksu.patch || true && cd ..

          # Patch kernel 5.4
          patch -p1 --fuzz=3 < ../susfs_patch.patch \
            && echo "SUSFS patch: OK" \
            || echo "SUSFS patch: applied with warnings"

          find . -name "*.orig" -delete 2>/dev/null || true
          find . -name "*.rej" -delete 2>/dev/null || true

      - name: Generate defconfig for fogos
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          MAKE_ARGS="O=../out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"

          echo ">>> Step 1: Base holi-qgki defconfig"
          make $MAKE_ARGS vendor/holi-qgki_defconfig

          echo ">>> Step 2: Merge fogos ext configs"
          for cfg in \
            arch/arm64/configs/vendor/ext_config/moto-holi.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config; do
            if [ -f "$cfg" ]; then
              echo "  Merging: $cfg"
              ./scripts/kconfig/merge_config.sh \
                -m -O ../out ../out/.config "$cfg"
            fi
          done

          echo ">>> Step 3: Set KSU + SUSFS + LTO configs"
          ./scripts/config --file ../out/.config \
            -e KSU \
            -d KSU_WITH_KPROBES \
            -e KSU_MANUAL_HOOK \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -d KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -d KSU_SUSFS_SUS_SU \
            -e LTO_NONE \
            -d LTO_CLANG \
            -e RELR

          echo ">>> Step 4: olddefconfig"
          yes "" | make $MAKE_ARGS olddefconfig

          echo "=== Config check ==="
          grep "CONFIG_KSU" ../out/.config | grep -v "^#" || echo "WARNING: KSU missing!"
          grep "CONFIG_KSU_SUSFS" ../out/.config | grep -v "^#" || echo "WARNING: SUSFS missing!"
          grep "CONFIG_LTO" ../out/.config | grep -v "^#" || echo "WARNING: LTO missing!"

          cp ../out/.config ../kernel.config

      - name: Upload kernel config (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: kernel.config
          retention-days: 7

      - name: Build kernel
        run: |
          cd kernel_src
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          echo ">>> Building dengan $(nproc) threads..."
          yes "" | make -j$(nproc) \
            O=../out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image 2>&1 | tee ../build.log

          if [ -f ../out/arch/arm64/boot/Image ]; then
            echo "=============================="
            echo "BUILD SUCCESS!"
            ls -lh ../out/arch/arm64/boot/Image
            echo "=============================="
          else
            echo "BUILD FAILED - Last 100 lines:"
            tail -100 ../build.log
            exit 1
          fi

      # ============================================================
      # Package AnyKernel3 dengan block=auto (fix partition error)
      # ============================================================
      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git ak3

          cp out/arch/arm64/boot/Image ak3/

          # Tulis anykernel.sh dengan block=auto (bukan hardcode)
          cat > ak3/anykernel.sh << 'EOF'
# AnyKernel3 Ramdisk Mod Script
# osm0sis @ xda-developers

## AnyKernel setup
# global properties
properties() { '
kernel.string=RKSU + SUSFS | fogos | AyakaUI
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=fogos
device.name2=moto_fogos
device.name3=XT2363-2
device.name4=XT2363-3
device.name5=XT2363-5
device.name6=XT2349-1
supported.versions=
supported.patchlevels=
'; }

## AnyKernel install
# boot shell variables
# block=auto: deteksi otomatis partisi boot (direkomendasikan untuk kompatibilitas luas)
# is_slot_device=1: aktifkan deteksi slot A/B (wajib untuk fogos)
block=auto
is_slot_device=1
ramdisk_compression=auto
patch_vbmeta_flag=auto

# import functions - DO NOT REMOVE
. tools/ak3-core.sh

## boot install
dump_boot
write_boot
## end boot install
EOF

          echo "=== Verifikasi anykernel.sh ==="
          cat ak3/anykernel.sh
          echo "=== Syntax check ==="
          bash -n ak3/anykernel.sh && echo "SYNTAX OK" || echo "SYNTAX ERROR!"

          DATE=$(date +%Y%m%d-%H%M)
          ZIP="kernel-fogos-rksu-susfs-${DATE}.zip"
          cd ak3
          zip -r9 "../${ZIP}" . -x ".git/*" -x ".github/*" "README.md" "*placeholder"
          cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          ls -lh "${ZIP}"

          echo "=== Isi ZIP ==="
          unzip -l "${ZIP}" | head -30

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fogos-rksu-susfs-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7